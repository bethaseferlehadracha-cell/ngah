<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2ED; --bg2:#E9E6DF; --card:#FFFFFF; --subtle:#ECE9E2; --border:#E0DCD2;
  --fg:#22262C; --fg2:#41454D; --muted:#6F737B;
  --primary:#22262C; --primary-fg:#FFFFFF;
  --lane:#F2C14E; --lane-soft:#FBEBC4; --lane-ink:#8A6410;
  --blue-soft:#D8E5F2; --blue-ink:#24609A;
  --green-soft:#D6EADF; --green-ink:#2D7050; --green-sign:#2E7552;
  --red-soft:#F4DAD6; --red-ink:#B5443B;
  --asphalt:#4A4F58; --asphalt2:#3B4048; --curb:#D9D5CC; --curb2:#BEB9AE; --paint:#FFFFFF;
  --rule-bg:#22262C; --rule-fg:#FFFFFF; --rule-sub:#D9DBE0;
  --shadow:0 1px 2px rgba(34,38,44,.05),0 8px 22px rgba(34,38,44,.07);
  --r:18px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171B; --bg2:#0F1114; --card:#1E2126; --subtle:#262A30; --border:#30353C;
  --fg:#EEF0F3; --fg2:#C9CCD2; --muted:#9A9FA8;
  --primary:#F2C14E; --primary-fg:#1A1C20;
  --lane:#E6B547; --lane-soft:#3A3220; --lane-ink:#F1CF7E;
  --blue-soft:#1F2D3B; --blue-ink:#9CC3EA;
  --green-soft:#1C3127; --green-ink:#8FD1AE; --green-sign:#2E7552;
  --red-soft:#3A2321; --red-ink:#F0A49B;
  --asphalt:#3A3E46; --asphalt2:#2E3238; --curb:#5A5850; --curb2:#4A4842; --paint:#E8E8E8;
  --rule-bg:#2A2E35; --rule-fg:#FFFFFF; --rule-sub:#C9CCD2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15171B; --bg2:#0F1114; --card:#1E2126; --subtle:#262A30; --border:#30353C;
  --fg:#EEF0F3; --fg2:#C9CCD2; --muted:#9A9FA8;
  --primary:#F2C14E; --primary-fg:#1A1C20;
  --lane:#E6B547; --lane-soft:#3A3220; --lane-ink:#F1CF7E;
  --blue-soft:#1F2D3B; --blue-ink:#9CC3EA;
  --green-soft:#1C3127; --green-ink:#8FD1AE; --green-sign:#2E7552;
  --red-soft:#3A2321; --red-ink:#F0A49B;
  --asphalt:#3A3E46; --asphalt2:#2E3238; --curb:#5A5850; --curb2:#4A4842; --paint:#E8E8E8;
  --rule-bg:#2A2E35; --rule-fg:#FFFFFF; --rule-sub:#C9CCD2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:700px){body{background:var(--bg2)} .app{box-shadow:0 0 0 1px var(--border),0 20px 60px rgba(0,0,0,.08)}}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);padding:10px 14px 9px;padding-top:calc(10px + env(safe-area-inset-top))}
.top-row{display:flex;align-items:center;gap:9px}
.icon-btn{width:36px;height:36px;flex:none;border-radius:11px;border:1px solid var(--border);background:var(--card);display:grid;place-items:center;padding:0}
.icon-btn svg{width:18px;height:18px}
.icon-btn:disabled{opacity:.3;cursor:default}
.emb{width:32px;height:32px;flex:none}
:root[data-theme="dark"] .emb{border-radius:50%;box-shadow:0 0 0 2px #fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .emb{border-radius:50%;box-shadow:0 0 0 2px #fff}}
.part{flex:1;min-width:0;line-height:1.2}
.part b{display:block;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.part small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-chip{display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:11px;border:1px solid var(--border);background:var(--card);font-size:12.5px;font-weight:800;flex:none}
.tb-chip svg{width:16px;height:16px;color:var(--lane-ink)}
.tb-chip.bump{animation:bump .6s ease}
@keyframes bump{30%{transform:scale(1.15);background:var(--lane-soft)}}
.prog{height:4px;background:var(--subtle);border-radius:3px;margin-top:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--lane);border-radius:3px;transition:width .45s ease}

/* ---------- layout ---------- */
main{flex:1;padding:8px 16px 24px}
.screen{animation:enter .4s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{position:sticky;bottom:0;z-index:25;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,color-mix(in srgb,var(--bg) 0%,transparent))}
.next{width:100%;height:54px;border:0;border-radius:15px;background:var(--primary);color:var(--primary-fg);font-size:16.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .2s,transform .1s}
.next svg{width:18px;height:18px}
.next:active{transform:scale(.98)}
.next:disabled{opacity:.28;cursor:default}
.bar .hint{text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:8px;min-height:0}

/* ---------- type ---------- */
.kicker{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:var(--lane-ink);background:var(--lane-soft);padding:5px 12px;border-radius:999px}
.kicker.g{color:var(--green-ink);background:var(--green-soft)}
.kicker.b{color:var(--blue-ink);background:var(--blue-soft)}
.kicker svg{width:14px;height:14px}
.h1{font-size:30px;font-weight:900;line-height:1.12;letter-spacing:-.5px;margin:10px 0 8px}
.lead{font-size:16.5px;line-height:1.6;color:var(--fg2)}
.lead b{color:var(--fg)}
.sec-t{font-size:15px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec-t::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--lane)}
.small{font-size:13px;color:var(--muted);line-height:1.5}
.mt{margin-top:14px}

/* ---------- avi speech ---------- */
.say{display:flex;gap:10px;align-items:flex-end;margin:12px 0 14px}
.say .av{width:50px;height:50px;border-radius:50%;background:var(--lane-soft);flex:none;overflow:hidden;display:grid;place-items:end center}
.say .av svg{width:50px;height:50px}
.say .bb{background:var(--card);border-radius:18px 18px 18px 5px;padding:11px 14px;box-shadow:var(--shadow);font-size:14.5px;line-height:1.55;flex:1}
.say .bb b.who{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:2px}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 17px}
.card + .card{margin-top:10px}
.card h3{font-size:17px;font-weight:800;margin-bottom:5px}
.card p{font-size:15px;line-height:1.6;color:var(--fg2)}
.quote{border-inline-start:3px solid var(--lane);padding:2px 12px;font-size:15px;line-height:1.6;color:var(--fg2)}
.quote small{display:block;color:var(--muted);font-size:12px;margin-top:4px}

/* reveal tiles */
.tiles{display:grid;gap:9px}
.tiles.two{grid-template-columns:1fr 1fr}
.tile{position:relative;text-align:start;border:1.5px solid var(--border);background:var(--card);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow);transition:border-color .2s,background .2s;width:100%}
.tile .tt{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15.5px;font-weight:800}
.tile .tt .no{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:900;flex:none;background:var(--subtle);color:var(--muted)}
.tile .plus{width:24px;height:24px;border-radius:50%;background:var(--subtle);display:grid;place-items:center;flex:none;transition:transform .3s}
.tile .plus svg{width:13px;height:13px}
.tile .tb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.tile .tb>div{overflow:hidden}
.tile .tb p{font-size:14.5px;line-height:1.6;color:var(--fg2);padding-top:8px;font-weight:400}
.tile.open{border-color:var(--lane)}
.tile.open .tb{grid-template-rows:1fr}
.tile.open .plus{transform:rotate(45deg);background:var(--lane-soft)}
.tile .lv{position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:4px;border-radius:0 3px 3px 0}

/* ---------- scene ---------- */
.scene{position:relative;border-radius:20px;overflow:hidden;background:var(--asphalt);box-shadow:var(--shadow)}
.scene svg{display:block;width:100%;height:auto}
.hud{position:absolute;top:10px;inset-inline:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.hud span{background:color-mix(in srgb,var(--card) 92%,transparent);border-radius:9px;padding:5px 9px;font-size:11.5px;font-weight:800;color:var(--fg)}
.hud .warn{background:var(--red-soft);color:var(--red-ink)}

/* ---------- events / options ---------- */
.evt{margin-top:12px}
.evt .no{font-size:12px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--lane);display:inline-block}
.evt h2{font-size:20px;font-weight:800;line-height:1.38;margin:6px 0 4px}
.evt p{font-size:15px;line-height:1.55;color:var(--fg2)}
.q{font-size:15px;font-weight:800;margin:18px 0 9px}
.opt{width:100%;display:flex;align-items:flex-start;gap:11px;text-align:start;padding:13px 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);font-size:15px;font-weight:500;line-height:1.45;margin-bottom:8px;transition:all .2s}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--subtle);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted);flex:none;margin-top:-1px}
.opt .fb{display:none;font-size:13.5px;line-height:1.5;margin-top:6px;font-weight:500}
.opt.wrong{border-color:var(--red-ink);background:var(--red-soft)}
.opt.wrong .k{background:var(--red-ink);color:#fff}
.opt.wrong .fb{display:block;color:var(--red-ink)}
.opt.right{border-color:var(--green-ink);background:var(--green-soft)}
.opt.right .k{background:var(--green-ink);color:var(--card)}
.opt.right .fb{display:block;color:var(--green-ink)}
.opt.dim{opacity:.4}
.opt:disabled{cursor:default}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

.rule{background:var(--rule-bg);color:var(--rule-fg);border-radius:var(--r);padding:16px;display:flex;gap:13px;align-items:flex-start;margin-top:12px;animation:pop .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}
.rule .ic{width:40px;height:40px;border-radius:12px;background:var(--lane);display:grid;place-items:center;flex:none}
.rule .ic svg{width:21px;height:21px;color:#22262C}
.rule small{color:var(--lane);font-weight:700;font-size:11.5px}
.rule b{display:block;font-size:18px;margin:2px 0 4px}
.rule p{font-size:14px;line-height:1.55;color:var(--rule-sub)}

/* ---------- classify ---------- */
.cls{display:flex;flex-direction:column;gap:9px}
.crow{background:var(--card);border-radius:15px;box-shadow:var(--shadow);padding:13px 14px;border:1.5px solid transparent;transition:border-color .2s,background .2s}
.crow .txt{font-size:15px;font-weight:600;line-height:1.45}
.crow .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.crow .btns button{flex:1 1 auto;min-width:0;border:1.5px solid var(--border);background:var(--subtle);border-radius:10px;padding:8px 9px;font-size:13px;font-weight:700;line-height:1.25}
.crow .btns button.bad{border-color:var(--red-ink);background:var(--red-soft);color:var(--red-ink)}
.crow .why{display:none;font-size:13.5px;line-height:1.5;margin-top:8px}
.crow.err .why{display:block;color:var(--red-ink)}
.crow.ok{border-color:var(--green-ink);background:var(--green-soft)}
.crow.ok .btns{display:none}
.crow.ok .why{display:block;color:var(--green-ink)}
.crow .lab{display:none;margin-top:8px;font-size:12px;font-weight:800;color:var(--green-ink);align-items:center;gap:6px}
.crow.ok .lab{display:flex}
.crow .lab svg{width:14px;height:14px}

/* ---------- pick many ---------- */
.pick{display:flex;flex-direction:column;gap:8px}
.pi{width:100%;display:flex;gap:11px;align-items:flex-start;text-align:start;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:13px 14px;font-size:15px;font-weight:600;line-height:1.45;transition:all .2s}
.pi .bx{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);flex:none;display:grid;place-items:center;margin-top:1px;transition:all .2s}
.pi .bx svg{width:13px;height:13px;opacity:0;color:var(--primary-fg)}
.pi.on{border-color:var(--fg)}
.pi.on .bx{background:var(--primary);border-color:var(--primary)}
.pi.on .bx svg{opacity:1}
.pi .why{display:none;font-size:13.5px;font-weight:500;margin-top:5px}
.pi.chk-ok{border-color:var(--green-ink);background:var(--green-soft)}
.pi.chk-ok .why{display:block;color:var(--green-ink)}
.pi.chk-bad{border-color:var(--red-ink);background:var(--red-soft)}
.pi.chk-bad .why{display:block;color:var(--red-ink)}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--fg);background:var(--card);border-radius:13px;padding:11px 18px;font-size:15px;font-weight:800;margin-top:12px;width:100%}
.btn2 svg{width:17px;height:17px}
.msg{font-size:14px;font-weight:600;margin-top:10px;padding:10px 13px;border-radius:12px;line-height:1.5}
.msg.ok{background:var(--green-soft);color:var(--green-ink)}
.msg.bad{background:var(--red-soft);color:var(--red-ink)}

/* ---------- tree ---------- */
.chain{display:flex;flex-direction:column;align-items:center;gap:0}
.cn{position:relative;display:flex;justify-content:center;width:100%}
.cn .mute{position:absolute;inset-inline-end:0;top:50%;transform:translateY(-50%);max-width:34%;font-size:12px;padding:7px 9px;line-height:1.25}
.nd{border-radius:12px;padding:8px 14px;font-size:14.5px;font-weight:800;text-align:center;line-height:1.2}
.nd small{display:block;font-size:10.5px;font-weight:600;opacity:.75;margin-bottom:1px}
.nd.l0{background:var(--primary);color:var(--primary-fg);padding:9px 28px}
.nd.l1{background:var(--blue-soft);color:var(--blue-ink)}
.nd.l2{background:var(--lane-soft);color:var(--lane-ink)}
.nd.mute{background:var(--subtle);color:var(--muted);font-weight:600;font-size:13px;display:flex;align-items:center}
.vl{width:2px;height:16px;background:var(--border)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:100%;position:relative;padding-top:16px}
.roles::before{content:"";position:absolute;top:0;inset-inline:25%;height:2px;background:var(--border)}
.role{position:relative;background:var(--card);border:1.5px dashed var(--border);border-radius:16px;padding:10px 9px 9px;min-height:150px;display:flex;flex-direction:column;gap:6px;transition:all .2s;text-align:start}
.role::before{content:"";position:absolute;top:-17px;right:50%;width:2px;height:16px;background:var(--border)}
.role .rh{background:var(--green-soft);color:var(--green-ink);border-radius:10px;padding:7px 8px;font-size:13.5px;font-weight:800;text-align:center;line-height:1.2}
.role .rh small{display:block;font-size:10px;font-weight:600;opacity:.8}
.role .cnt{font-size:10.5px;color:var(--muted);font-weight:800}
.role .placed{background:var(--subtle);border-radius:9px;padding:6px 8px;font-size:12.5px;font-weight:700;line-height:1.3;animation:pop .35s ease}
.role.target{border-color:var(--green-ink);border-style:solid;background:color-mix(in srgb,var(--green-soft) 45%,var(--card))}
.role.full{border-style:solid;border-color:var(--green-ink)}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chipb{border:1.5px solid var(--border);background:var(--card);border-radius:11px;padding:8px 11px;font-size:13.5px;font-weight:700;line-height:1.3;box-shadow:var(--shadow);text-align:start;transition:all .15s}
.chipb.sel{border-color:var(--fg);background:var(--lane-soft);transform:translateY(-2px)}

/* ---------- field builder ---------- */
.fld{background:var(--card);border-radius:15px;box-shadow:var(--shadow);padding:12px 14px;border:1.5px solid transparent}
.fld + .fld{margin-top:9px}
.fld .fl{font-size:12.5px;font-weight:800;color:var(--muted);display:flex;justify-content:space-between}
.fld .fv{font-size:15px;font-weight:700;margin-top:3px;min-height:22px;color:var(--fg)}
.fld .fv.empty{color:var(--muted);font-weight:500}
.fld .ch{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.fld .ch button{border:1.5px solid var(--border);background:var(--subtle);border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:600;text-align:start;line-height:1.35}
.fld .ch button.bad{border-color:var(--red-ink);background:var(--red-soft);color:var(--red-ink)}
.fld .fw{display:none;font-size:13px;color:var(--red-ink);margin-top:7px;line-height:1.45}
.fld.err .fw{display:block}
.fld.ok{border-color:var(--green-ink)}
.fld.ok .ch{display:none}
.fld.ok .fl span:last-child{color:var(--green-ink)}

/* ---------- stages road ---------- */
.road{position:relative;padding-inline-start:30px}
.road::before{content:"";position:absolute;inset-inline-start:11px;top:8px;bottom:8px;width:6px;border-radius:3px;background:repeating-linear-gradient(to bottom,var(--lane) 0 12px,transparent 12px 22px),var(--asphalt)}
.stage{position:relative;margin-bottom:9px}
.stage::before{content:"";position:absolute;inset-inline-start:-25px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--card);border:3px solid var(--green-sign)}
.stage.later::before{border-color:var(--muted)}
.signbox{display:flex;align-items:center;gap:10px;background:var(--green-sign);color:#fff;border-radius:12px;padding:10px 12px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--green-sign);font-weight:700;font-size:14.5px;line-height:1.3}
.signbox i{font-style:normal;font-weight:900;background:#fff;color:var(--green-sign);border-radius:6px;width:24px;height:24px;display:grid;place-items:center;font-size:13px;flex:none}
.stage.later .signbox{background:var(--card);color:var(--muted);box-shadow:0 0 0 1.5px var(--border);border-color:var(--card)}
.stage.later .signbox i{background:var(--subtle);color:var(--muted)}

/* station header sign */
.st-sign{display:inline-flex;align-items:center;gap:8px;background:var(--green-sign);color:#fff;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--green-sign);border-radius:10px;padding:5px 11px 5px 9px;font-size:12.5px;font-weight:800}
.st-sign i{font-style:normal;background:#fff;color:var(--green-sign);border-radius:5px;width:20px;height:20px;display:grid;place-items:center;font-weight:900;font-size:12px}
.mini-route{display:flex;gap:4px;margin:4px 0 2px}
.mini-route span{flex:1;height:5px;border-radius:3px;background:var(--border)}
.mini-route span.on{background:var(--green-sign)}
.mini-route span.done{background:color-mix(in srgb,var(--green-sign) 45%,var(--border))}

/* ---------- sheet & weights ---------- */
.wrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:11px 12px}
.wrow + .wrow{margin-top:8px}
.wrow .wt{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.35}
.wrow .wt small{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--subtle);color:var(--muted);margin-top:4px}
.wrow .wt small.cx{background:var(--lane-soft);color:var(--lane-ink)}
.step{display:flex;align-items:center;gap:4px;flex:none}
.step button{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--border);background:var(--subtle);font-size:18px;font-weight:800;display:grid;place-items:center;padding:0;line-height:1}
.step b{width:46px;text-align:center;font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}
.total{display:flex;align-items:center;justify-content:space-between;margin-top:12px;background:var(--subtle);border-radius:14px;padding:12px 14px;font-weight:800}
.total .num{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.total.ok{background:var(--green-soft);color:var(--green-ink)}
.total.over{background:var(--red-soft);color:var(--red-ink)}
.sheet{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-top:12px;animation:pop .5s ease}
.sheet .sh-h{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--primary);color:var(--primary-fg)}
.sheet .sh-h img{width:26px;height:26px}
.sheet .sh-h b{font-size:14.5px}
.sheet .sh-h small{display:block;font-size:11.5px;opacity:.75;font-weight:500}
.sheet .sh-meta{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.sheet .sh-meta div{background:var(--card);padding:8px 12px;font-size:12px;color:var(--muted);font-weight:600}
.sheet .sh-meta div b{display:block;color:var(--fg);font-size:13.5px}
.sheet .sh-r{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--border);font-size:13.5px;font-weight:600;line-height:1.35}
.sheet .sh-r:first-of-type{border-top:0}
.sheet .sh-r .sc{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.sheet .sh-r .w{font-size:12.5px;font-weight:900;color:var(--lane-ink);min-width:36px;text-align:end}
.sheet .sh-th{background:var(--subtle);font-size:11.5px;font-weight:800;color:var(--muted);padding:7px 14px}

/* ---------- sim ---------- */
.sim-cap{min-height:52px;margin-top:10px;font-size:15px;font-weight:700;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.sim-cap .fn{flex:none;font-size:12px;font-weight:900;background:var(--lane-soft);color:var(--lane-ink);border-radius:8px;padding:4px 8px;margin-top:1px}
.tbar{height:4px;border-radius:2px;background:var(--subtle);overflow:hidden;margin-top:8px}
.tbar i{display:block;height:100%;width:0;background:var(--fg)}
.sim-ctl{display:flex;gap:8px;margin-top:10px}
.sim-ctl button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--border);background:var(--card);border-radius:12px;padding:9px;font-size:13.5px;font-weight:700}
.sim-ctl svg{width:15px;height:15px}
.mrow{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:11px 12px;border:1.5px solid transparent}
.mrow + .mrow{margin-top:8px}
.mrow .mt-t{font-size:14px;font-weight:700;line-height:1.35}
.mrow .mt-t small{font-size:11px;font-weight:800;color:var(--lane-ink);background:var(--lane-soft);padding:1px 6px;border-radius:5px;margin-inline-start:4px}
.marks{display:flex;gap:6px;margin-top:8px}
.marks button{flex:1;border:1.5px solid var(--border);background:var(--subtle);border-radius:10px;padding:7px 0;font-size:13.5px;font-weight:800}
.marks button.on{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.mrow .avi-m{display:none;font-size:12.5px;font-weight:700;margin-top:7px}
.mrow.cmp .avi-m{display:block}
.mrow.match{border-color:var(--green-ink)}
.mrow.match .avi-m{color:var(--green-ink)}
.mrow.near{border-color:var(--lane)}
.mrow.near .avi-m{color:var(--lane-ink)}
.mrow.miss{border-color:var(--red-ink)}
.mrow.miss .avi-m{color:var(--red-ink)}

/* ---------- loop ---------- */
.loop{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;text-align:center}
.loop .lp{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:10px 6px;font-size:13px;font-weight:800;line-height:1.3}
.loop .lp.hl{background:var(--lane-soft);color:var(--lane-ink)}
.loop .lp.end{background:var(--green-soft);color:var(--green-ink)}
.loop .ar{color:var(--muted);font-weight:900}
.loop svg,.cyc svg{width:18px;height:18px;color:var(--muted)}

/* ---------- toolbox sheet ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(15,17,20,.45);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.panel{width:100%;max-width:520px;max-height:84vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.panel .grab{width:40px;height:5px;border-radius:3px;background:var(--border);margin:2px auto 12px}
.tbx{display:flex;flex-direction:column;gap:8px}
.tbi{display:flex;gap:11px;background:var(--card);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow)}
.tbi .n{width:28px;height:28px;border-radius:9px;background:var(--lane);color:#22262C;font-weight:900;font-size:13px;display:grid;place-items:center;flex:none}
.tbi.lock{opacity:.45;box-shadow:none;background:var(--subtle)}
.tbi.lock .n{background:var(--border);color:var(--muted)}
.tbi b{font-size:15px;display:block}
.tbi p{font-size:13.5px;line-height:1.5;color:var(--fg2);margin-top:2px}

/* ---------- hero ---------- */
.hero-emb{display:flex;align-items:center;gap:10px;margin-top:4px}
.hero-emb img{width:54px;height:54px}
.hero-emb div{font-size:13px;font-weight:700;line-height:1.3}
.hero-emb small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.title-xl{font-size:58px;font-weight:900;line-height:.95;letter-spacing:-1.5px;margin:18px 0 12px}
.title-xl span{position:relative;display:inline-block;z-index:0}
.title-xl span::after{content:"";position:absolute;inset-inline:-2px;bottom:5px;height:12px;background:var(--lane);opacity:.6;z-index:-1;border-radius:3px}
.hero-scene{position:relative;border-radius:24px;overflow:hidden;height:300px;margin-top:20px;background:var(--asphalt);box-shadow:var(--shadow)}
.hero-scene svg.rd{position:absolute;inset:0;width:100%;height:100%}
.hero-scene .ex{position:absolute;bottom:0;inset-inline-start:-4px;width:170px}
.hero-scene .bb{position:absolute;top:18px;inset-inline-end:14px;width:62%;background:var(--card);border-radius:16px;padding:11px 13px;font-size:14px;line-height:1.5;box-shadow:var(--shadow);font-weight:500}
.hero-scene .bb b{display:block;font-size:11px;color:var(--muted)}
.route{display:flex;gap:5px;flex-wrap:wrap;margin-top:16px}
.route .rs{display:flex;align-items:center;gap:5px;padding:4px 9px 4px 7px;border-radius:8px;background:var(--green-sign);color:#fff;font-size:11.5px;font-weight:700;border:1.5px solid #fff;box-shadow:0 0 0 1.2px var(--green-sign)}
.route .rs i{font-style:normal;font-weight:900;background:#fff;color:var(--green-sign);border-radius:4px;width:16px;height:16px;display:grid;place-items:center;font-size:10.5px}

.big-avi{display:flex;justify-content:center;margin:8px 0 -6px}
.big-avi svg{width:170px}
.mission{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-top:12px}
.mission .mh{background:var(--green-sign);color:#fff;padding:11px 15px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}
.mission .mh svg{width:17px;height:17px}
.mission .mb{padding:14px 15px;font-size:15px;line-height:1.6;color:var(--fg2)}
.mission .mb b{color:var(--fg)}

.ring{position:relative;width:150px;height:150px;margin:6px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rv b{font-size:38px;font-weight:900;display:block;line-height:1}
.ring .rv small{font-size:12px;color:var(--muted);font-weight:700}
.qcount{font-size:12.5px;font-weight:800;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.qdots{display:flex;gap:4px}
.qdots i{width:16px;height:6px;border-radius:3px;background:var(--border)}
.qdots i.ok{background:var(--green-ink)}
.qdots i.no{background:var(--red-ink)}
.qdots i.cur{background:var(--fg)}
canvas.conf{position:fixed;inset:0;pointer-events:none;z-index:80;width:100%;height:100%}

.toggle-ex{display:flex;align-items:center;justify-content:space-between;width:100%;border:1.5px dashed var(--border);background:transparent;border-radius:14px;padding:11px 14px;font-size:14px;font-weight:700;margin-top:12px;color:var(--fg2)}
.toggle-ex svg{width:16px;height:16px;transition:transform .3s}
.toggle-ex.open svg{transform:rotate(180deg)}
.exbox{display:none;margin-top:8px}
.exbox.open{display:block;animation:enter .3s}
.ex-doc{background:var(--subtle);border-radius:14px;padding:13px 14px;font-size:14px;line-height:1.65;color:var(--fg2)}
.ex-doc b{color:var(--fg)}
.ex-doc .lbl{font-size:11.5px;font-weight:800;color:var(--muted);display:block;margin-bottom:4px}


.learned{background:var(--blue-soft);color:var(--blue-ink);border-radius:15px;padding:11px 14px;margin-top:4px}
.learned b{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800}
.learned b svg{width:15px;height:15px}
.learned ul{margin:6px 0 0;padding-inline-start:18px;font-size:13.5px;line-height:1.55;font-weight:500;color:var(--fg2)}
.ord-slots{display:flex;flex-direction:column;gap:6px}
.oslot{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--border);border-radius:12px;padding:9px 12px;min-height:44px;font-size:14px;font-weight:700}
.oslot .on{width:24px;height:24px;border-radius:7px;background:var(--subtle);color:var(--muted);display:grid;place-items:center;font-size:12.5px;font-weight:900;flex:none}
.oslot.ok{border-style:solid;border-color:var(--green-ink);background:var(--green-soft);color:var(--green-ink);animation:pop .35s ease}
.oslot.ok .on{background:var(--green-ink);color:var(--card)}
.tb-chip{cursor:default}


.tile.rv{animation:enter .45s calc(var(--i)*55ms) both}
.rv-hint{display:flex;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.rv-hint span{display:inline-flex;align-items:center;gap:5px}
.rv-hint svg{width:13px;height:13px}
.rv-hint .h2t{display:none;color:var(--green-ink)}
.tile.seen .rv-hint .h1t{display:none}
.tile.seen .rv-hint .h2t{display:inline-flex}
.tile.rv.open .rv-hint{display:none}
.tile.rv.seen:not(.open) .plus{background:var(--green-soft);color:var(--green-ink)}

.callout{background:var(--blue-soft);border-radius:15px;padding:12px 14px}
.callout b{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:800;color:var(--blue-ink)}
.callout b svg{width:15px;height:15px}
.callout p{font-size:14px;line-height:1.6;color:var(--fg);margin-top:5px}
.sheet .sh-r .nt{grid-column:1/-1;font-size:12.5px;font-weight:500;line-height:1.5;color:var(--fg2);background:var(--subtle);border-radius:8px;padding:6px 9px;margin-top:2px}
.sheet .sh-r .nt b{color:var(--fg);font-weight:800}
.mt-n{font-size:12px;line-height:1.5;color:var(--muted);margin-top:4px;font-weight:500}
.resume{margin-top:18px;background:var(--green-soft);border-radius:18px;padding:14px 15px}
.resume .rs-t{display:flex;gap:10px;align-items:flex-start}
.resume .rs-t svg{width:20px;height:20px;color:var(--green-ink);flex:none;margin-top:2px}
.resume b{display:block;font-size:15.5px;color:var(--green-ink)}
.resume small{display:block;font-size:13px;color:var(--fg2);margin-top:2px}
.resume .rs-b{display:flex;gap:8px;margin-top:12px}
.btn-res{flex:1.4;height:46px;border:0;border-radius:13px;background:var(--green-ink);color:var(--card);font:800 15px 'Heebo',sans-serif}
.btn-new{flex:1;height:46px;border:1.5px solid var(--green-ink);border-radius:13px;background:transparent;color:var(--green-ink);font:700 14.5px 'Heebo',sans-serif}
.grp{display:flex;flex-direction:column;gap:9px}
.gr-t{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px}
.gr-t span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.pbar.sm{height:7px;margin-top:0}

.gd{display:flex;flex-direction:column;gap:10px}
.gd-c{display:flex;gap:12px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 15px;animation:enter .45s both}
.gd-c:nth-child(2){animation-delay:.06s}.gd-c:nth-child(3){animation-delay:.12s}.gd-c:nth-child(4){animation-delay:.18s}
.gd-i{width:40px;height:40px;border-radius:12px;background:var(--lane-soft);color:var(--lane-ink);display:grid;place-items:center;flex:none}
.gd-i svg{width:20px;height:20px}
.gd-c b{display:block;font-size:16px;font-weight:800;margin-bottom:3px}
.gd-c p,.gd-c li{font-size:14.5px;line-height:1.6;color:var(--fg2)}
.gd-c ul{margin:4px 0 0;padding-inline-start:18px}
.gd-c li b{display:inline;font-size:inherit;margin:0;color:var(--fg)}
.gd-c p b{display:inline;font-size:inherit;margin:0;color:var(--fg)}
.gd-flow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:8px}
.gd-flow span{background:var(--green-soft);color:var(--green-ink);border-radius:8px;padding:4px 9px;font-size:12.5px;font-weight:800}
.gd-flow i{font-style:normal;color:var(--muted);font-weight:900;font-size:12px}
/* flip cards */
.flips{display:grid;gap:10px}
.flips.c2{grid-template-columns:1fr 1fr}
.fc{perspective:1100px;border:0;background:none;padding:0;text-align:start;width:100%;font:inherit;color:inherit;animation:enter .45s calc(var(--i)*55ms) both}
.fc-in{display:grid;height:100%;transition:transform .65s cubic-bezier(.3,.75,.25,1);transform-style:preserve-3d}
.fc.on .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:14px 15px;min-height:104px}
.fc-f{background:var(--card);border:1.5px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:border-color .2s,transform .2s}
.fc-f::after{content:"";position:absolute;inset-inline:0;bottom:0;height:4px;background:repeating-linear-gradient(90deg,var(--ac) 0 16px,transparent 16px 26px);opacity:.55}
.fc:hover .fc-f{border-color:var(--ac)}
.fc:active .fc-f{transform:scale(.985)}
.fc-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.fc-no{min-width:26px;height:26px;padding:0 6px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:900;background:color-mix(in srgb,var(--ac) 18%,var(--card));color:var(--fg)}
.fc-dot{width:10px;height:10px;border-radius:50%;background:var(--ac)}
.fc-k{font-size:11px;font-weight:800;color:var(--muted)}
.fc-h{font-size:16px;font-weight:800;line-height:1.3;flex:1}
.flips.c2 .fc-h{font-size:15px}
.fc-hint{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center}
.fc-hint span{display:inline-flex;align-items:center;gap:5px}
.fc-hint svg{width:13px;height:13px}
.fc-hint .h2t{display:none;color:var(--green-ink)}
.fc.seen .fc-hint .h1t{display:none}
.fc.seen .fc-hint .h2t{display:inline-flex}
.fc-b{transform:rotateY(180deg);background:var(--card);border:1.5px solid var(--ac);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.fc-bh{font-size:12px;font-weight:800;color:var(--muted)}
.fc-bt{font-size:14.5px;line-height:1.6;color:var(--fg);font-weight:500}
.flips.c2 .fc-bt{font-size:13.5px}
@media (prefers-reduced-motion:reduce){.fc-in{transition:none!important}}
/* name */
.namebox{margin-top:18px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 15px}
.namebox label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}
.namebox input{width:100%;height:50px;border-radius:13px;border:1.5px solid var(--border);background:var(--bg);color:var(--fg);font:600 16.5px 'Heebo',system-ui,sans-serif;padding:0 14px;outline:none;transition:border-color .2s,box-shadow .2s}
.namebox input:focus{border-color:var(--fg);box-shadow:0 0 0 4px color-mix(in srgb,var(--lane) 35%,transparent)}
.namebox small{display:block;font-size:12px;color:var(--muted);margin-top:7px}
/* ladder */
.ladder{display:flex;flex-direction:column;gap:6px}
.lr{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:13px;box-shadow:var(--shadow);padding:10px 12px;font-size:14.5px;line-height:1.4;border-inline-start:4px solid var(--lc);animation:enter .4s both}
.lr:nth-child(2){margin-inline-start:10px}.lr:nth-child(3){margin-inline-start:20px}.lr:nth-child(4){margin-inline-start:30px}.lr:nth-child(5){margin-inline-start:40px}
.lr .ln{width:22px;height:22px;border-radius:7px;background:var(--subtle);display:grid;place-items:center;font-size:12px;font-weight:900;color:var(--muted);flex:none}
/* tree criteria level */
.crit{border:1.5px dashed var(--border);border-radius:11px;padding:6px;display:flex;flex-direction:column;gap:5px;min-height:70px;flex:1}
.crit .crh{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;font-weight:800;color:var(--fg);background:var(--subtle);border-radius:7px;padding:4px 7px}
.role.full .crit{border-color:var(--green-ink);border-style:solid}
.plc{display:flex;flex-direction:column;gap:5px}
/* stepbar */
.stepbar{display:flex;align-items:center;gap:6px}
.stepbar .sb{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.stepbar .sb i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--subtle);display:grid;place-items:center;font-size:11.5px}
.stepbar .sb.on{color:var(--fg)}.stepbar .sb.on i{background:var(--primary);color:var(--primary-fg)}
.stepbar .sb.done{color:var(--green-ink)}.stepbar .sb.done i{background:var(--green-ink);color:var(--card)}
.stepbar .sbl{flex:1;height:2px;background:var(--border);min-width:8px}
/* envelopes */
.env{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.env + .env{margin-top:10px}
.env-h{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;font-weight:800;background:var(--lane-soft);color:var(--lane-ink)}
.env.ex2 .env-h{background:var(--blue-soft);color:var(--blue-ink)}
.env-h svg{width:16px;height:16px}
.env-b{padding:12px 14px;font-size:14px;line-height:1.7;color:var(--fg2)}
.env-b b{color:var(--fg)}
/* instructions */
.instr{background:var(--lane-soft);border-radius:16px;padding:13px 15px}
.instr>b{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:800;color:var(--lane-ink)}
.instr>b svg{width:16px;height:16px}
.instr ol{margin:8px 0 0;padding-inline-start:20px;font-size:14px;line-height:1.6;color:var(--fg)}
.instr li+li{margin-top:4px}
/* summary */
.cert{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-top:6px}
.cert-h{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:6px}
.cert-h img{width:44px;height:44px;flex:none}
.cert-h b{display:block;font-size:18px;font-weight:900;line-height:1.3}
.cert-h small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.stat{background:var(--subtle);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:900;line-height:1.1}
.stat span{font-size:11.5px;font-weight:700;color:var(--muted)}
.stat.ok{background:var(--green-soft)}.stat.ok b{color:var(--green-ink)}
.stat.no{background:var(--red-soft)}.stat.no b{color:var(--red-ink)}

/* ================= state ================= */
let S=store.get(KEY)||{};
S={i:0,last:0,done:{},fin:{},sc:{},prog:{},quiz:null,best:0,name:'',...S};
S.fin=S.fin||{};S.sc=S.sc||{};S.prog=S.prog||{};
function save(){store.set(KEY,S)}

/* ================= helpers & gating ================= */
const main=$('#main'),nextB=$('#next'),hint=$('#hint');
let canNext=true;
let G={total:0,opened:0,task:true,msg:''};
function refresh(){
  const sc=SCR[S.i];
  const left=Math.max(0,G.total-G.opened);
  let ok=G.task&&left===0;
  if(!sc.strict&&S.done[sc.id])ok=true;
  canNext=ok;nextB.disabled=!ok;
  const parts=[];
  if(!ok){
    if(left>0)parts.push(left===1?'נותרה כרטיסייה אחת לפתיחה':`נותרו ${left} כרטיסיות לפתיחה`);
    if(!G.task)parts.push(G.msg||'השלם את התרגול');
  }
  hint.textContent=parts.join(' · ');
  if(ok){S.fin[sc.id]=1;if(!sc.strict)S.done[sc.id]=1;save();}
}
function setDone(v,msg){G.task=!!v;G.msg=msg||'השלם את התרגול';refresh();}
/* score across the whole lomda – first attempt of every practice item */
function tally(ok){const id=SCR[S.i].id;if(S.fin[id])return;const r=S.sc[id]||(S.sc[id]={ok:0,bad:0});ok?r.ok++:r.bad++;save();}
function ruleCard(id,label){const p=PI[id];return `<div class="rule"><span class="ic">${I.wrench}</span><div><small>${label||'העיקרון'}</small><b>${p.n}</b><p>${p.t}</p></div></div>`;}
const STN=['תרחיש ותסריט','מרכיבי תפקיד וקריטריונים','ציינון, גורמים מסבכים ודף תצפית (מחוון)','חיבור הוראות המבחן','הרצת פיילוט','הערכה'];
const STN_S=['תרחיש ותסריט','מרכיבי תפקיד','דף תצפית (מחוון)','הוראות','פיילוט','הערכה'];
function stationHead(n,title,kind){return `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span class="st-sign"><i>${n}</i>שלב ${n} מתוך 6</span>${kind?`<span class="kicker ${kind==='תרגול'?'':'b'}">${kind==='תרגול'?I.wheel:I.book}${kind}</span>`:''}</div><div class="mini-route">${[1,2,3,4,5,6].map(k=>`<span class="${k<n?'done':k===n?'on':''}"></span>`).join('')}</div><h1 class="h1">${title}</h1>`;}
/* accordion tiles – closed by default (used on the summary screen only, not gated) */
function tiles(list,cls){return `<div class="tiles ${cls||''}">${list.map(t=>`<button class="tile" type="button">${t.c?`<span class="lv" style="background:${t.c}"></span>`:''}<span class="tt"><span style="display:flex;align-items:center;gap:9px">${t.no?`<span class="no">${t.no}</span>`:''}${t.h}</span><span class="plus">${I.plus}</span></span><span class="tb"><div><p>${t.b}</p></div></span></button>`).join('')}</div>`;}
/* expanding cards – closed by default, gated like flip cards */
function reveals(list){return `<div class="tiles rvs">${list.map((t,i)=>`<button class="tile rv" type="button" style="--i:${i}">${t.c?`<span class="lv" style="background:${t.c}"></span>`:''}<span class="tt"><span style="display:flex;align-items:center;gap:9px">${t.no?`<span class="no">${t.no}</span>`:''}${t.h}</span><span class="plus">${I.plus}</span></span><span class="rv-hint"><span class="h1t">לחץ לפתיחה</span><span class="h2t">${I.check}נפתח</span></span><span class="tb"><div><p>${t.b}</p></div></span></button>`).join('')}</div>`;}
function wireTiles(root){$$('.tile',root).forEach(t=>t.addEventListener('click',()=>t.classList.toggle('open')));}
/* flip cards – closed by default, every card must be opened before moving on */
function flips(list,cols){return `<div class="flips ${cols===2?'c2':''}">${list.map((t,i)=>`<button class="fc" type="button" style="--i:${i};--ac:${t.c||'var(--lane)'}" aria-label="${t.h.replace(/<[^>]+>/g,'')} – לחץ לחשיפה"><span class="fc-in"><span class="fc-f"><span class="fc-top">${t.no?`<span class="fc-no">${t.no}</span>`:'<span class="fc-dot"></span>'}${t.k?`<span class="fc-k">${t.k}</span>`:''}</span><span class="fc-h">${t.h}</span><span class="fc-hint"><span class="h1t">${I.flip}לחץ לחשיפה</span><span class="h2t">${I.check}נחשף · לחץ שוב</span></span></span><span class="fc-b"><span class="fc-bh">${t.h}</span><span class="fc-bt">${t.b}</span></span></span></button>`).join('')}</div>`;}
function wireFlips(root){
  $$('.tile.rv',root).forEach(t=>{G.total++;t.addEventListener('click',()=>{t.classList.toggle('open');if(!t.classList.contains('seen')){t.classList.add('seen');G.opened++;refresh();}});});
  const fs=$$('.fc',root);G.total+=fs.length;
  fs.forEach(f=>f.addEventListener('click',()=>{f.classList.toggle('on');if(!f.classList.contains('seen')){f.classList.add('seen');G.opened++;refresh();}}));
}
function learnedBox(items){return `<div class="learned"><b>${I.book}מה למדת – ומה תתרגל עכשיו</b><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* MCQ */
function mcq(root,opts,cb){
  const L='אבגדה';
  root.innerHTML=opts.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><span class="k">${L[i]}</span><span><span>${o.t}</span><span class="fb">${o.f||''}</span></span></button>`).join('');
  let first=true;
  $$('.opt',root).forEach(b=>b.addEventListener('click',()=>{
    const o=opts[+b.dataset.i];
    if(o.ok){$$('.opt',root).forEach(x=>{x.disabled=true;if(x!==b&&!x.classList.contains('wrong'))x.classList.add('dim')});b.classList.add('right');if(!root.dataset.nt)tally(first);cb&&cb(first);}
    else{b.classList.add('wrong');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');first=false;}
  }));
}
/* classify */
function classify(root,items,cats,cb){
  root.innerHTML=`<div class="cls">${items.map((it,i)=>`<div class="crow" data-i="${i}"><div class="txt">${it.t}</div><div class="btns">${cats.map((c,j)=>`<button type="button" data-c="${j}">${c}</button>`).join('')}</div><div class="lab">${I.check}<span>${cats[it.c]}</span></div><div class="why">${it.why||''}</div></div>`).join('')}</div>`;
  let left=items.length;
  $$('.crow',root).forEach(r=>{const it=items[+r.dataset.i];let miss=false;$$('.btns button',r).forEach(b=>b.addEventListener('click',()=>{
    if(+b.dataset.c===it.c){r.classList.remove('err');r.classList.add('ok');$('.why',r).textContent=it.why||'';tally(!miss);left--;if(!left)cb&&cb();}
    else{miss=true;b.classList.add('bad');r.classList.add('err');$('.why',r).textContent=it.bad||it.why||'לא בדיוק. נסה שוב.';r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake');}
  }))});
}
/* pick many */
function pickMany(root,items,cb){
  root.innerHTML=`<div class="pick">${items.map((it,i)=>`<button type="button" class="pi" data-i="${i}"><span class="bx">${I.check}</span><span><span>${it.t}</span><span class="why">${it.why}</span></span></button>`).join('')}</div><button class="btn2 chk" type="button">${I.search}בדיקה</button><div class="msg-w"></div>`;
  const ps=$$('.pi',root);
  ps.forEach(p=>p.addEventListener('click',()=>{if(root.dataset.solved)return;p.classList.toggle('on');ps.forEach(x=>x.classList.remove('chk-ok','chk-bad'));$('.msg-w',root).innerHTML='';}));
  let firstChk=true;
  $('.chk',root).addEventListener('click',()=>{
    let bad=0;ps.forEach(p=>{const it=items[+p.dataset.i],on=p.classList.contains('on');const right=(!!it.ok)===on;if(firstChk)tally(right);
      p.classList.remove('chk-ok','chk-bad');if(on||!right)p.classList.add(right?'chk-ok':'chk-bad');if(!right)bad++;});
    firstChk=false;
    const m=$('.msg-w',root);
    if(!bad){root.dataset.solved=1;$('.chk',root).style.display='none';m.innerHTML=`<div class="msg ok">מעולה – בחרת בדיוק את הנכונים.</div>`;cb&&cb();}
    else m.innerHTML=`<div class="msg bad">${bad===1?'סימון אחד לא נכון':bad+' סימונים לא נכונים'}. קרא את ההסבר בכרטיסים האדומים, תקן ובדוק שוב.</div>`;
  });
}
/* order: tap items in sequence */
function orderTask(root,steps,cb){
  const sh=steps.map((s,i)=>({s,i})).sort((a,b)=>((a.i*7+3)%steps.length)-((b.i*7+3)%steps.length));
  root.innerHTML=`<div class="ord-slots">${steps.map((_,i)=>`<div class="oslot"><span class="on">${i+1}</span><span class="ot"></span></div>`).join('')}</div><div class="bank">${sh.map(x=>`<button class="chipb" type="button" data-i="${x.i}">${x.s}</button>`).join('')}</div><div class="msgw"></div>`;
  let n=0,miss=false;
  $$('.chipb',root).forEach(c=>c.addEventListener('click',()=>{
    if(+c.dataset.i===n){const sl=$$('.oslot',root)[n];$('.ot',sl).textContent=steps[n];sl.classList.add('ok');c.remove();tally(!miss);miss=false;n++;$('.msgw',root).innerHTML='';if(n===steps.length){$('.msgw',root).innerHTML='<div class="msg ok">הסדר נכון.</div>';cb&&cb();}}
    else{miss=true;c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');$('.msgw',root).innerHTML=`<div class="msg bad">זה לא השלב הבא. מה קורה מיד אחרי "${n?steps[n-1]:'הרצת הפיילוט'}"?</div>`;}
  }));
}

}

    </div>
    <div class="sec-t" style="margin-top:16px">פירוט לפי חלקי הלומדה</div>
    <div class="grp">${groups.map(g=>{const t=g.ok+g.bad,p=t?Math.round(g.ok/t*100):0;return `<div class="gr"><div class="gr-t"><span>${g.g}</span><span>${g.ok}/${t} · ${p}%</span></div><div class="pbar sm"><i data-w="${p}"></i></div></div>`;}).join('')}</div>
    <p class="small" style="text-align:center;margin-top:10px">התוצאות מבוססות על הניסיון הראשון בכל תרגול ובכל שאלה לאורך הלומדה${qz!=null?` · באתגר המסכם: ${qz} מתוך ${QZ.length}`:''}.</p>
  </div>
  <div class="sec-t">ששת השלבים שעברת</div>
  <div class="road">${STN.map((s,i)=>`<div class="stage"><div class="signbox"><i>${i+1}</i>${s}</div></div>`).join('')}</div>
  <div class="sec-t">עקרונות לניהול מבחן מעשי</div>
  ${tiles(P.map((p,i)=>({no:i+1,h:p.n,b:p.t})))}`;
  wireTiles(m);
  setTimeout(()=>{const r=$('#rg',m);if(r)r.style.strokeDashoffset=C*(1-(tot?ok/tot:0));$$('.pbar i',m).forEach(x=>x.style.width=x.dataset.w+'%');},120);
  confetti();
  setDone(true);
},next(){S={i:0,last:0,done:{},fin:{},sc:{},prog:{},quiz:null,best:S.best||0,w:null,name:S.name||''};save();go(0);}});

/* ================= confetti ================= */
function confetti(){
  if(RM)return;const cv=document.createElement('canvas');cv.className='conf';document.body.appendChild(cv);
  const ctx=cv.getContext('2d'),W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;
  const cols=['#F2C14E','#2E7552','#24609A','#B5443B','#D9D5CC'];
  const ps=Array.from({length:120},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*16*devicePixelRatio,vy:(-Math.random()*14-6)*devicePixelRatio,s:(5+Math.random()*6)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0;(function f(){ctx.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.45*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();});t++;if(t<170)requestAnimationFrame(f);else cv.remove();})();
}

/* ================= navigation ================= */
let cur=null;
function go(i){
  if(cur&&cur._cleanup)cur._cleanup();
  i=Math.max(0,Math.min(SCR.length-1,i||0));S.i=i;if(i>0)S.last=i;save();
  const sc=SCR[i];
  $('#partT').textContent=sc.part;$('#partS').textContent=sc.sub;
  $('#prog').style.width=(i/(SCR.length-1)*100)+'%';
  $('#back').disabled=i===0;
  $('#stg').textContent=sc.st?('שלב '+sc.st+'/6'):(sc.id==='quiz'||sc.id==='end'?'סיום':'פתיחה');
  $('#nextT').textContent=sc.btn||(i===SCR.length-2?'לסיכום':'המשך');
  main.innerHTML='';const d=document.createElement('div');d.className='screen';main.appendChild(d);cur=d;
  G={total:0,opened:0,task:true,msg:''};
  if(!S.fin[sc.id]&&!S.prog[sc.id])S.sc[sc.id]={ok:0,bad:0};
  sc.render(d);
  refresh();
  window.scrollTo({top:0,behavior:'auto'});
}
nextB.addEventListener('click',()=>{if(!canNext)return;const sc=SCR[S.i];if(sc.next){sc.next();return;}go(S.i+1);});
$('#back').addEventListener('click',()=>go(S.i-1));
/* theme */
const root=document.documentElement;
function sysDark(){return matchMedia('(prefers-color-scheme: dark)').matches}
function curDark(){const t=root.getAttribute('data-theme');return t?t==='dark':sysDark();}
function themeIcon(){$('#theme').innerHTML=curDark()?I.sun:I.moon;$('meta[name=theme-color]').content=curDark()?'#15171B':'#F4F2ED';}
const savedT=store.get(KEY+'-theme');if(savedT)root.setAttribute('data-theme',savedT);
$('#theme').addEventListener('click',()=>{const n=curDark()?'light':'dark';root.setAttribute('data-theme',n);store.set(KEY+'-theme',n);themeIcon();});
themeIcon();
go(0);
window.__lomda={go,SCR,S:()=>S};
})();
</script>
