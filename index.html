<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בונה מבחן מעשי | בית הספר להדרכה</title>
<style>
/* ==========================================================================
   DESIGN TOKENS — Military / modern / pastel, clean, no external assets
   ========================================================================== */
:root{
  /* Palette */
  --bg:            #F2F0E8;   /* warm paper khaki-white */
  --bg-deep:       #E9E6DA;   /* slightly deeper panel bg */
  --panel:         #FFFFFF;
  --panel-soft:    #FBFAF6;
  --ink:           #2B2E27;   /* charcoal-olive text */
  --ink-soft:      #5C6155;
  --ink-faint:     #8C9086;
  --line:          #DEDACB;
  --line-soft:     #EAE7DB;

  --sage:          #7E8F6E;   /* primary accent — olive sage */
  --sage-deep:     #5E6E52;
  --sage-pale:     #E4E9DC;

  --slate:         #6D7F8C;   /* secondary accent — steel blue-grey */
  --slate-deep:    #4F606C;
  --slate-pale:    #E2E9EC;

  --sand:          #C79A5A;   /* tertiary accent — brass / warning */
  --sand-deep:     #A47B3E;
  --sand-pale:     #F3E7D2;

  --success:       #6E9A5C;
  --success-pale:  #E3EEDD;
  --danger:        #B15848;
  --danger-pale:   #F3E1DC;
  --info:          #5C7E93;
  --info-pale:     #DEE9EE;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;

  --font-display: "Segoe UI Semibold","Segoe UI","Arial Hebrew","Arial",sans-serif;
  --font-body: "Segoe UI","Arial Hebrew","Arial",sans-serif;
  --font-mono: "Consolas","Courier New",monospace;

  --shadow-sm: 0 1px 2px rgba(43,46,39,.06), 0 1px 1px rgba(43,46,39,.04);
  --shadow-md: 0 4px 14px rgba(43,46,39,.08);
  --shadow-lg: 0 10px 30px rgba(43,46,39,.14);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  min-height:100vh;
}
h1,h2,h3,h4{
  font-family:var(--font-display);
  color:var(--ink);
  margin:0 0 6px 0;
  letter-spacing:.2px;
}
p{margin:0 0 10px 0;}
button{font-family:inherit;}
input,textarea,select{font-family:inherit;font-size:14px;}
::selection{background:var(--sage-pale);}

/* Scrollbar (subtle) */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

/* ==========================================================================
   LAYOUT SHELL
   ========================================================================== */
.app-header{
  background:linear-gradient(180deg,#3E4A38 0%, #4A5941 100%);
  color:#F2F0E8;
  padding:14px 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  flex-wrap:wrap;
  box-shadow:var(--shadow-md);
  position:sticky;top:0;z-index:50;
}
.app-header .brand{display:flex;align-items:center;gap:12px;}
.app-header .brand-mark{
  width:38px;height:38px;border-radius:8px;
  background:var(--sand);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-weight:700;color:#3E4A38;font-size:13px;
  flex:none;
}
.app-header h1{color:#fff;font-size:17px;margin:0;}
.app-header .subtitle{color:#D8DECC;font-size:12px;margin-top:1px;}
.app-header .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.draft-pill{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.22);
  color:#F2F0E8;
  padding:6px 12px;
  border-radius:20px;
  font-size:12.5px;
  display:flex;align-items:center;gap:8px;
}
.draft-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--sand);flex:none;}
.dot.saved{background:#8FBF7C;}

.tabs{
  display:flex;gap:4px;
  background:var(--bg-deep);
  padding:6px;
  margin:0;
  overflow-x:auto;
  border-bottom:1px solid var(--line);
  position:sticky;top:66px;z-index:40;
}
.tab-btn{
  border:none;background:transparent;
  padding:10px 18px;
  font-size:13.5px;
  font-weight:600;
  color:var(--ink-soft);
  border-radius:var(--radius-sm) var(--radius-sm) 0 0;
  cursor:pointer;
  white-space:nowrap;
  display:flex;align-items:center;gap:8px;
  transition:background .15s,color .15s;
}
.tab-btn .num{
  font-family:var(--font-mono);
  font-size:11px;
  background:var(--line);
  color:var(--ink-soft);
  padding:1px 6px;border-radius:4px;
}
.tab-btn.active{background:var(--panel);color:var(--sage-deep);box-shadow:var(--shadow-sm);}
.tab-btn.active .num{background:var(--sage);color:#fff;}
.tab-btn:hover:not(.active){background:var(--line-soft);}

.view{display:none;padding:22px;max-width:1400px;margin:0 auto;}
.view.active{display:block;}

/* ==========================================================================
   WIZARD LAYOUT
   ========================================================================== */
.wizard-grid{
  display:grid;
  grid-template-columns:220px 1fr 300px;
  gap:20px;
  align-items:start;
}
@media (max-width:1100px){
  .wizard-grid{grid-template-columns:1fr;}
  .stepper{order:1;}
  .step-panel{order:2;}
  .live-status{order:3;}
}

/* Stepper */
.stepper{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:14px 10px;
  position:sticky;top:118px;
  box-shadow:var(--shadow-sm);
}
.stepper-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;
  border-radius:var(--radius-md);
  cursor:pointer;
  margin-bottom:2px;
  transition:background .15s;
}
.stepper-item:hover{background:var(--line-soft);}
.stepper-item.active{background:var(--sage-pale);}
.step-badge{
  width:26px;height:26px;flex:none;
  border-radius:6px;
  background:var(--line);
  color:var(--ink-soft);
  font-family:var(--font-mono);font-weight:700;font-size:12px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);
}
.stepper-item.active .step-badge{background:var(--sage);color:#fff;border-color:var(--sage-deep);}
.stepper-item.done .step-badge{background:var(--success);color:#fff;border-color:var(--success);}
.stepper-item.warn .step-badge{background:var(--sand);color:#fff;border-color:var(--sand-deep);}
.step-label{font-size:12.5px;color:var(--ink);font-weight:600;}
.stepper-item.active .step-label{color:var(--sage-deep);}

/* Step content panel */
.step-panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:26px 28px;
  box-shadow:var(--shadow-sm);
  min-height:420px;
}
.step-eyebrow{
  font-family:var(--font-mono);
  font-size:11.5px;
  letter-spacing:1px;
  color:var(--sage-deep);
  background:var(--sage-pale);
  display:inline-block;
  padding:3px 9px;
  border-radius:5px;
  margin-bottom:10px;
}
.step-panel h2{font-size:20px;}
.step-desc{color:var(--ink-soft);font-size:13.5px;margin-bottom:20px;}

.field-row{margin-bottom:16px;}
.field-row label{
  display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:5px;
}
.field-hint{font-size:12px;color:var(--ink-faint);margin-top:4px;}
.field-row input[type=text],
.field-row input[type=number],
.field-row textarea,
.field-row select{
  width:100%;
  padding:10px 12px;
  border:1.5px solid var(--line);
  border-radius:var(--radius-sm);
  background:var(--panel-soft);
  color:var(--ink);
  transition:border-color .15s, box-shadow .15s;
}
.field-row input:focus,
.field-row textarea:focus,
.field-row select:focus{
  outline:none;border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-pale);
}
.field-row textarea{resize:vertical;min-height:90px;}
.field-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.field-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
@media (max-width:700px){.field-grid-2,.field-grid-3{grid-template-columns:1fr;}}

.check-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13.5px;}
.check-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--sage);}

.btn{
  border:none;border-radius:var(--radius-sm);
  padding:10px 18px;
  font-size:13.5px;font-weight:700;
  cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;
  transition:transform .1s, box-shadow .15s, background .15s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--sage);color:#fff;}
.btn-primary:hover{background:var(--sage-deep);}
.btn-secondary{background:var(--slate-pale);color:var(--slate-deep);}
.btn-secondary:hover{background:#D3DEE3;}
.btn-outline{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
.btn-outline:hover{border-color:var(--sage);color:var(--sage-deep);}
.btn-danger{background:var(--danger-pale);color:var(--danger);}
.btn-danger:hover{background:#EACFC8;}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

.step-nav{display:flex;justify-content:space-between;margin-top:26px;padding-top:18px;border-top:1px solid var(--line-soft);}

/* Cards for repeatable lists (role components / criteria / factors) */
.entity-card{
  border:1.5px solid var(--line);
  border-radius:var(--radius-md);
  padding:16px 16px 14px;
  margin-bottom:14px;
  background:var(--panel-soft);
  position:relative;
}
.entity-card .entity-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
.entity-card .entity-title-input{font-weight:700;font-size:14.5px;}
.entity-index{
  font-family:var(--font-mono);font-size:11px;color:var(--sage-deep);
  background:var(--sage-pale);padding:2px 8px;border-radius:5px;flex:none;
}
.criteria-list{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;}
.criterion-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
  align-items:start;
  background:var(--panel);
  border:1px solid var(--line-soft);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  margin-bottom:8px;
}
.criterion-flags{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;}
.criterion-flags label{font-size:12px;display:flex;align-items:center;gap:5px;color:var(--ink-soft);}
.tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:12px;
  margin-inline-end:6px;
}
.tag-warn{background:var(--sand-pale);color:var(--sand-deep);}
.tag-bad{background:var(--danger-pale);color:var(--danger);}
.tag-ok{background:var(--success-pale);color:var(--success);}

/* Live status panel */
.live-status{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  padding:18px;
  position:sticky;top:118px;
  box-shadow:var(--shadow-sm);
}
.live-status h3{font-size:13.5px;display:flex;align-items:center;gap:8px;}
.readiness-meter{
  background:var(--bg-deep);
  border-radius:20px;
  height:10px;
  overflow:hidden;
  margin:10px 0 6px;
}
.readiness-fill{height:100%;background:linear-gradient(90deg,var(--sand),var(--success));border-radius:20px;transition:width .3s;}
.readiness-label{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
.rule-item{
  display:flex;align-items:flex-start;gap:9px;
  padding:8px 0;
  border-bottom:1px solid var(--line-soft);
  font-size:12.3px;
}
.rule-item:last-child{border-bottom:none;}
.rule-led{
  width:10px;height:10px;border-radius:3px;flex:none;margin-top:3px;
  border:1px solid rgba(0,0,0,.08);
}
.rule-led.pass{background:var(--success);}
.rule-led.warn{background:var(--sand);}
.rule-led.fail{background:var(--danger);}
.rule-led.info{background:var(--ink-faint);}
.rule-text b{display:block;color:var(--ink);font-weight:700;margin-bottom:1px;}
.rule-text span{color:var(--ink-soft);}

/* ==========================================================================
   OBSERVATION SHEET VIEW
   ========================================================================== */
.sheet-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.sheet-wrap{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius-lg);
  box-shadow:var(--shadow-sm);
  padding:0;
  max-width:1000px;
  margin:0 auto;
  overflow:hidden;
}
.sheet-doc{padding:34px 38px;}
.sheet-doc h2{text-align:center;font-size:19px;border-bottom:2px solid var(--sage);padding-bottom:10px;margin-bottom:18px;}
.sheet-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin-bottom:20px;font-size:13px;}
.sheet-meta-grid div{border-bottom:1px dotted var(--line);padding-bottom:4px;}
.sheet-meta-grid b{color:var(--sage-deep);}
table.sheet-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:18px;}
table.sheet-table th{
  background:var(--sage-pale);color:var(--sage-deep);
  padding:8px 6px;border:1px solid var(--line);font-size:11.5px;
}
table.sheet-table td{padding:7px 6px;border:1px solid var(--line);vertical-align:top;}
table.sheet-table tr.rc-row td{background:var(--slate-pale);font-weight:700;color:var(--slate-deep);}
.sheet-score-box{
  display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px;
  padding-top:14px;border-top:2px solid var(--line);
}
.score-chip{
  background:var(--bg-deep);border-radius:var(--radius-md);
  padding:10px 18px;text-align:center;min-width:120px;
}
.score-chip .val{font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--sage-deep);}
.score-chip .lab{font-size:11px;color:var(--ink-soft);}
.score-chip.pass .val{color:var(--success);}
.score-chip.fail .val{color:var(--danger);}
.empty-note{
  text-align:center;color:var(--ink-faint);padding:60px 20px;font-size:14px;
}

/* ==========================================================================
   VALIDATION TAB
   ========================================================================== */
.validation-summary{
  display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;
}
@media (max-width:800px){.validation-summary{grid-template-columns:1fr 1fr;}}
.vsum-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:16px;text-align:center;box-shadow:var(--shadow-sm);
}
.vsum-card .num{font-family:var(--font-mono);font-size:26px;font-weight:700;}
.vsum-card .lab{font-size:12px;color:var(--ink-soft);margin-top:2px;}
.vsum-card.pass .num{color:var(--success);}
.vsum-card.warn .num{color:var(--sand-deep);}
.vsum-card.fail .num{color:var(--danger);}
.rule-detail-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:16px 18px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start;
  box-shadow:var(--shadow-sm);
}
.rule-detail-card .led-big{width:16px;height:16px;border-radius:4px;flex:none;margin-top:3px;}
.rule-detail-card h4{font-size:14px;margin-bottom:4px;}
.rule-detail-card p{font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
.rule-fix{font-size:12.5px;background:var(--sand-pale);color:var(--sand-deep);padding:8px 10px;border-radius:6px;}

/* ==========================================================================
   DRAFTS TAB
   ========================================================================== */
.drafts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media (max-width:800px){.drafts-grid{grid-template-columns:1fr;}}
.draft-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-md);
  padding:16px;box-shadow:var(--shadow-sm);
}
.draft-list-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 10px;border-bottom:1px solid var(--line-soft);gap:10px;
}
.draft-list-item:last-child{border-bottom:none;}
.draft-list-item .name{font-weight:700;font-size:13.5px;}
.draft-list-item .meta{font-size:11.5px;color:var(--ink-faint);}
.storage-warning{
  background:var(--danger-pale);color:var(--danger);padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:14px;
}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:12px 22px;border-radius:30px;
  font-size:13px;box-shadow:var(--shadow-lg);
  opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media print{
  .app-header,.tabs,.sheet-toolbar,.stepper,.live-status,.step-nav{display:none !important;}
  body{background:#fff;}
  .view{display:none !important;padding:0;}
  .view.print-active{display:block !important;}
  .sheet-wrap{box-shadow:none;border:none;max-width:100%;}
}

/* ==========================================================================
   תוספות: העלאת תיק, בחירת תוכן, נגישות אינטראקטיבית
   ========================================================================== */
.dropzone{
  border:2.5px dashed var(--line);
  border-radius:var(--radius-lg);
  background:var(--panel);
  padding:50px 30px;
  text-align:center;
  max-width:640px;
  margin:0 auto;
  transition:border-color .15s, background .15s;
  cursor:pointer;
}
.dropzone.dragover{border-color:var(--sage);background:var(--sage-pale);}
.dropzone .icon{font-size:42px;margin-bottom:12px;}
.dropzone h3{margin-bottom:6px;}
.dropzone p{color:var(--ink-soft);font-size:13px;}
.dropzone input[type=file]{display:none;}

.upload-hero{max-width:640px;margin:10px auto 26px;text-align:center;}
.upload-hero h2{font-size:22px;}
.upload-hero p{color:var(--ink-soft);font-size:14px;}

.analyzing-box{
  max-width:480px;margin:40px auto;text-align:center;
}
.spinner{
  width:42px;height:42px;border-radius:50%;
  border:4px solid var(--line);border-top-color:var(--sage);
  margin:0 auto 16px;
  animation:spin 0.9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:1000px;margin:0 auto 24px;}
@media (max-width:800px){.summary-grid{grid-template-columns:1fr 1fr;}}
.summary-card{
  background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius-md);
  padding:16px;text-align:center;box-shadow:var(--shadow-sm);
}
.summary-card.found{border-color:var(--success);}
.summary-card.missing{border-color:var(--sand);background:var(--sand-pale);}
.summary-card .icon{font-size:18px;}
.summary-card .num{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--sage-deep);}
.summary-card.missing .num{color:var(--sand-deep);}
.summary-card .lab{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

.accordion{max-width:1000px;margin:0 auto;}
.acc-item{
  background:var(--panel);border:1.5px solid var(--line);border-radius:var(--radius-md);
  margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm);
}
.acc-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;cursor:pointer;user-select:none;
}
.acc-head:hover{background:var(--line-soft);}
.acc-head .title{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:10px;}
.acc-badge{
  font-family:var(--font-mono);font-size:11.5px;
  background:var(--sage-pale);color:var(--sage-deep);
  padding:2px 9px;border-radius:10px;
}
.acc-badge.empty{background:var(--sand-pale);color:var(--sand-deep);}
.acc-chevron{transition:transform .2s;color:var(--ink-faint);}
.acc-item.open .acc-chevron{transform:rotate(180deg);}
.acc-body{display:none;padding:0 18px 18px;}
.acc-item.open .acc-body{display:block;}

.cand-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.cand-toolbar input[type=text]{
  flex:1;min-width:160px;padding:8px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
}
.cand-toolbar select{padding:8px 10px;border:1.5px solid var(--line);border-radius:var(--radius-sm);}
.cand-count{font-size:12px;color:var(--ink-soft);white-space:nowrap;}

.cand-table{width:100%;border-collapse:collapse;font-size:13px;}
.cand-table tr{border-bottom:1px solid var(--line-soft);}
.cand-table tr:hover{background:var(--panel-soft);}
.cand-table td{padding:8px 6px;vertical-align:top;}
.cand-table td.chk{width:34px;text-align:center;}
.cand-table td.actions{width:70px;text-align:left;white-space:nowrap;}
.cand-text{line-height:1.5;}
.cand-text textarea{width:100%;min-height:50px;}
.cand-source{font-size:11px;color:var(--ink-faint);margin-top:3px;}
.cand-parent{font-size:11px;color:var(--slate-deep);background:var(--slate-pale);padding:1px 7px;border-radius:8px;display:inline-block;margin-inline-end:6px;}

.missing-inline{
  background:var(--sand-pale);border:1px dashed var(--sand-deep);border-radius:var(--radius-md);
  padding:14px 16px;
}
.missing-inline .flag{color:var(--sand-deep);font-weight:700;font-size:13px;margin-bottom:8px;}
.missing-inline .add-row{display:flex;gap:8px;}
.missing-inline textarea{flex:1;min-height:44px;}

.selection-footer{
  max-width:1000px;margin:24px auto 0;
  display:flex;justify-content:space-between;align-items:center;gap:14px;
  padding-top:18px;border-top:1px solid var(--line);
}
.file-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--sage-pale);color:var(--sage-deep);
  padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:600;margin-bottom:18px;
}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="brand-mark">מ״מ</div>
    <div>
      <h1>בונה מבחן מעשי</h1>
      <div class="subtitle">בית הספר להדרכה · מנוע ניתוח תיקי מדריך</div>
    </div>
  </div>
  <div class="header-actions">
    <span class="draft-pill" id="draftPill"><span class="dot" id="draftDot"></span><span id="draftPillText">טרם הועלה תיק</span></span>
    <button class="btn btn-secondary btn-sm" id="btnQuickSave" title="שמירה מהירה">💾 שמור טיוטה</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab-btn active" data-view="upload"><span class="num">1</span> העלאת תיק מדריך</button>
  <button class="tab-btn" data-view="selection"><span class="num">2</span> בחירת תוכן</button>
  <button class="tab-btn" data-view="wizard"><span class="num">3</span> עריכה ואישוש</button>
  <button class="tab-btn" data-view="sheet"><span class="num">4</span> דף תצפית</button>
  <button class="tab-btn" data-view="validation"><span class="num">5</span> בדיקת תקינות</button>
  <button class="tab-btn" data-view="drafts"><span class="num">6</span> טיוטות שמורות</button>
</nav>

<main>
  <section class="view active" id="view-upload">
    <div id="uploadContent"></div>
  </section>

  <section class="view" id="view-selection">
    <div id="selectionContent"></div>
  </section>

  <section class="view" id="view-wizard">
    <div class="wizard-grid">
      <div class="stepper" id="stepper"></div>
      <div class="step-panel" id="stepPanel"></div>
      <div class="live-status" id="liveStatus"></div>
    </div>
  </section>

  <section class="view" id="view-sheet">
    <div id="sheetContent"></div>
  </section>

  <section class="view" id="view-validation">
    <div id="validationContent"></div>
  </section>

  <section class="view" id="view-drafts">
    <div id="draftsContent"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

/* ==========================================================================
   מנוע ניתוח מסמכים — DOCX / PDF -> בלוקים -> קטגוריות מועמדים
   פועל כולו בדפדפן (DOMParser מובנה + fflate מוטמע לפתיחת ZIP/Deflate)
   ========================================================================== */

var W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';

function wEls(node, tag){
  return Array.prototype.slice.call(node.getElementsByTagNameNS(W_NS, tag));
}

/* ---------- שלב 1: קריאת קובץ DOCX לבלוקים ---------- */
function docxParagraphText(p){
  return wEls(p,'t').map(function(t){return t.textContent;}).join('');
}
function docxParagraphIsBold(p){
  var runs = wEls(p,'r');
  if(runs.length===0) return false;
  var textRuns = runs.filter(function(r){ return wEls(r,'t').some(function(t){return t.textContent.trim().length>0;}); });
  if(textRuns.length===0) return false;
  return textRuns.every(function(r){
    var rpr = wEls(r,'rPr')[0];
    if(!rpr) return false;
    var b = wEls(rpr,'b')[0];
    if(!b) return false;
    var v = b.getAttribute('w:val');
    return v!=='0' && v!=='false';
  });
}
function docxParagraphIsUnderline(p){
  var runs = wEls(p,'r');
  return runs.some(function(r){
    var rpr = wEls(r,'rPr')[0];
    if(!rpr) return false;
    var u = wEls(rpr,'u')[0];
    if(!u) return false;
    var v = u.getAttribute('w:val');
    return v && v!=='none';
  });
}
function docxParagraphListLevel(p){
  var ppr = wEls(p,'pPr')[0];
  if(!ppr) return null;
  var numPr = wEls(ppr,'numPr')[0];
  if(!numPr) return null;
  var ilvl = wEls(numPr,'ilvl')[0];
  return ilvl ? parseInt(ilvl.getAttribute('w:val'),10) : 0;
}
function docxParagraphStyle(p){
  var ppr = wEls(p,'pPr')[0];
  if(!ppr) return null;
  var st = wEls(ppr,'pStyle')[0];
  return st ? st.getAttribute('w:val') : null;
}

function parseDocxBlocks(xmlString){
  var parser = new DOMParser();
  var doc = parser.parseFromString(xmlString, 'application/xml');
  var perr = doc.getElementsByTagName('parsererror');
  if(perr && perr.length>0){ throw new Error('שגיאה בפענוח מבנה ה-XML של המסמך'); }
  var body = doc.getElementsByTagNameNS(W_NS,'body')[0];
  if(!body) throw new Error('לא נמצא גוף מסמך תקין (word/document.xml)');
  var blocks = [];
  Array.prototype.forEach.call(body.childNodes, function(node){
    if(!node.localName) return;
    if(node.localName === 'p'){
      var text = docxParagraphText(node).trim();
      if(!text) return;
      var style = docxParagraphStyle(node);
      blocks.push({
        type:'p', text:text,
        bold: docxParagraphIsBold(node),
        underline: docxParagraphIsUnderline(node),
        listLevel: docxParagraphListLevel(node),
        headingStyle: !!(style && /heading|title/i.test(style))
      });
    } else if(node.localName === 'tbl'){
      var rows = wEls(node,'tr').map(function(tr){
        return wEls(tr,'tc').map(function(tc){
          return wEls(tc,'p').map(docxParagraphText).filter(function(t){return t.trim().length>0;}).join('\n').trim();
        });
      }).filter(function(r){ return r.some(function(c){return c.trim().length>0;}); });
      if(rows.length>0) blocks.push({type:'table', rows:rows});
    }
  });
  return blocks;
}

/* ---------- שלב 1ב: קריאת קובץ PDF (עם תמיכה בגופני CID/Type0 הנפוצים בעברית) ---------- */

/* פרסר למפת ToUnicode (CMap) — הכרחי לפענוח טקסט עברי בפונטים מוטמעים (Identity-H) */
function parseToUnicodeCMap(text){
  var map = {};
  var bfcharRe = /beginbfchar([\s\S]*?)endbfchar/g, m;
  while((m = bfcharRe.exec(text))){
    var pairRe = /<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g, p;
    while((p = pairRe.exec(m[1]))){
      map[parseInt(p[1],16)] = hexToUnicodeStr(p[2]);
    }
  }
  var bfrangeRe = /beginbfrange([\s\S]*?)endbfrange/g;
  while((m = bfrangeRe.exec(text))){
    var body = m[1];
    var combinedRe = /<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*(?:<([0-9A-Fa-f]+)>|\[([^\]]+)\])/g, p;
    while((p = combinedRe.exec(body))){
      var lo=parseInt(p[1],16), hi=parseInt(p[2],16);
      if(p[3]!==undefined){
        var dstStart = parseInt(p[3],16);
        for(var c=lo;c<=hi;c++) map[c]=String.fromCharCode(dstStart+(c-lo));
      } else if(p[4]!==undefined){
        var items = p[4].match(/<([0-9A-Fa-f]+)>/g)||[];
        for(var i=0;i<items.length && lo+i<=hi;i++) map[lo+i]=hexToUnicodeStr(items[i].replace(/[<>]/g,''));
      }
    }
  }
  return map;
}
function hexToUnicodeStr(hex){
  var s='';
  for(var i=0;i<hex.length;i+=4){ s += String.fromCharCode(parseInt(hex.substr(i,4),16)||0); }
  return s;
}
function tryDecompressStream(streamData){
  var u8 = new Uint8Array(streamData.length);
  for(var j=0;j<streamData.length;j++) u8[j] = streamData.charCodeAt(j) & 0xFF;
  try{ return fflate.unzlibSync(u8); }catch(e){}
  try{ return fflate.inflateSync(u8); }catch(e){}
  return null;
}

/* מפריד את קובץ ה-PDF הגולמי לאובייקטים (N G obj ... endobj), כל אחד עם מילון גולמי וזרם גולמי (אם יש) */
function parsePdfObjects(raw){
  var objects = {};
  var objRe = /(\d+)\s+\d+\s+obj([\s\S]*?)endobj/g, m;
  while((m = objRe.exec(raw))){
    var body = m[2];
    var sm = body.match(/stream\r?\n([\s\S]*?)\r?\nendstream/);
    objects[m[1]] = { dictText: sm ? body.slice(0, sm.index) : body, rawStream: sm ? sm[1] : null };
  }
  return objects;
}

/* בכל מסמך PDF כל שם גופן ברמת המשאבים (למשל /F1) מצביע באופן עקבי לאותו מספר עצם גופן */
function buildFontNameToObjMap(raw){
  var map = {};
  var fontDictRe = /\/Font\s*<<([^>]*)>>/g, m;
  while((m = fontDictRe.exec(raw))){
    var pairRe = /\/(F\d+)\s+(\d+)\s+\d+\s+R/g, pm;
    while((pm = pairRe.exec(m[1]))){ map[pm[1]] = pm[2]; }
  }
  return map;
}

/* עבור כל גופן, שולף את מפת ה-ToUnicode הספציפית שלו (ולא ממזג את כולן יחד — גופנים שונים
   משתמשים לרוב באותם קודי CID עבור תווים שונים לגמרי, ומיזוג גורם לטקסט משובש) */
function buildFontCidMaps(objects, fontNameToObj){
  var fontCidMaps = {};
  Object.keys(fontNameToObj).forEach(function(fname){
    var objNum = fontNameToObj[fname];
    if(fontCidMaps[objNum] !== undefined) return;
    var obj = objects[objNum];
    if(!obj) return;
    var m = obj.dictText.match(/\/ToUnicode\s+(\d+)\s+\d+\s+R/);
    if(!m) return;
    var cmapObj = objects[m[1]];
    if(!cmapObj || !cmapObj.rawStream) return;
    var decoded = tryDecompressStream(cmapObj.rawStream);
    if(!decoded) return;
    fontCidMaps[objNum] = parseToUnicodeCMap(fflate.strFromU8(decoded, true));
  });
  return fontCidMaps;
}

function decodeShowToken(tok, cidMap){
  if(tok.charAt(0)==='<'){
    var hex = tok.slice(1,-1).replace(/\s+/g,'');
    if(cidMap){
      var s='';
      for(var i=0;i<hex.length;i+=4){
        var code = parseInt(hex.substr(i,4),16);
        if(cidMap[code]!==undefined) s += cidMap[code];
      }
      return s;
    }
    var s2='';
    for(var j=0;j<hex.length;j+=2){ s2 += String.fromCharCode(parseInt(hex.substr(j,2),16)||0); }
    return s2;
  }
  return decodePdfString(tok.slice(1,-1));
}
function decodePdfString(s){
  return s.replace(/\\([0-7]{1,3}|.)/g, function(all, code){
    if(/^[0-7]{1,3}$/.test(code)) return String.fromCharCode(parseInt(code,8));
    if(code==='n') return '\n';
    if(code==='r') return '';
    if(code==='t') return '\t';
    return code;
  });
}

/* מפענח זרם תוכן PDF תוך מעקב אחר החלפות גופן (Tf) וקיבוץ קטעי טקסט לפי קואורדינטת Y (Tm) —
   כיוון שיוצרי PDF רבים מפרקים שורה חזותית אחת (למשל "1. יש לשים לב...") למספר קריאות Tj/TJ נפרדות
   (מספר הרשימה בנפרד מהטקסט), קיבוץ לפי אותה שורת Y משחזר את השורה המלאה כראוי. */
function extractTextFromPdfContentStream(content, fontNameToObj, fontCidMaps){
  var lines = [];
  var currentCidMap = null;
  var currentY = null;

  var tokenRe = /\/(F\d+)\s+[\d.]+\s+Tf|(-?[\d.]+)\s+(-?[\d.]+)\s+(-?[\d.]+)\s+(-?[\d.]+)\s+(-?[\d.]+)\s+(-?[\d.]+)\s+Tm|(\((?:\\.|[^\\()])*\)|<[0-9A-Fa-f\s]*>)\s*Tj|\[((?:[^\[\]])*)\]\s*TJ/g;
  var m;
  while((m = tokenRe.exec(content))){
    if(m[1]){
      var objNum = fontNameToObj[m[1]];
      currentCidMap = objNum!=null ? fontCidMaps[objNum] : null;
    } else if(m[7]!==undefined){
      var y = parseFloat(m[7]);
      if(currentY===null || Math.abs(y-currentY)>1.5){ flush(); currentY = y; }
    } else if(m[8]!==undefined){
      var isHex = m[8].charAt(0)==='<';
      var t = decodeShowToken(m[8], currentCidMap);
      buf += (isHex && currentCidMap ? t.split('').reverse().join('') : t);
    } else if(m[9]!==undefined){
      var showTokenRe = /\((?:\\.|[^\\()])*\)|<[0-9A-Fa-f\s]*>/g, sm, line='', hadHex=false;
      while((sm = showTokenRe.exec(m[9]))){
        if(sm[0].charAt(0)==='<') hadHex = true;
        line += decodeShowToken(sm[0], currentCidMap);
      }
      buf += (hadHex && currentCidMap ? line.split('').reverse().join('') : line);

}

function parsePdfBlocks(arrayBuffer){
  var bytes = new Uint8Array(arrayBuffer);
  var raw = '';
  var CHUNK = 0x8000;
  for(var i=0;i<bytes.length;i+=CHUNK){
    raw += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i+CHUNK, bytes.length)));
  }

  var objects = parsePdfObjects(raw);
  var fontNameToObj = buildFontNameToObjMap(raw);
  var fontCidMaps = buildFontCidMaps(objects, fontNameToObj);

  var textChunks = [];
  Object.keys(objects).forEach(function(num){
    var obj = objects[num];
    if(!obj.rawStream) return;
    var decoded = tryDecompressStream(obj.rawStream);
    var text = decoded ? fflate.strFromU8(decoded, true) : obj.rawStream;
    if(text.indexOf('beginbfchar')!==-1 || text.indexOf('beginbfrange')!==-1) return; /* זרם CMap, לא תוכן */
    if(text.indexOf('Tj')===-1 && text.indexOf('TJ')===-1) return;
    var extracted = extractTextFromPdfContentStream(text, fontNameToObj, fontCidMaps);
    if(extracted) textChunks.push(extracted);
  });

  var fullText = textChunks.join('\n');
  var rawLines = fullText.split(/\n+/).map(function(l){return l.trim();}).filter(function(l){return l.length>0;});

  /* סינון כותרות/כותרות תחתונות חוזרות (למשל שם המחלקה ומספרי עמוד המופיעים בכל עמוד) */
  var freq = {};
  rawLines.forEach(function(l){ freq[l] = (freq[l]||0)+1; });
  var seenBoilerplate = {};
  var lines = rawLines.filter(function(l){
    if(/^\d{1,4}$/.test(l)) return false; /* מספר עמוד בודד */
    if(/^-?\s*בלמ["\u05f4]?ס\s*-?$/.test(l)) return false; /* סיווג ביטחוני חוזר */
    if(freq[l] >= 4 && l.length < 90){
      if(seenBoilerplate[l]) return false;
      seenBoilerplate[l] = true;
      return false; /* גם המופע הראשון של כותרת חוזרת אינו תוכן שימושי לבניית מבחן */
    }
    return true;
  });

  var blocks = [];
  lines.forEach(function(line){
    var isBullet = /^([•\-\*◦]|\d+[\.\)]|[א-ת]\.)\s+/.test(line);
    var cleaned = line.replace(/^([•\-\*◦]|\d+[\.\)]|[א-ת]\.)\s+/, '');
    blocks.push({
      type:'p', text: cleaned,
      bold:false, /* אין מידע גופן אמין ב-PDF כללי — הזיהוי מסתמך על נקודתיים/מילות מפתח בלבד */
      underline:false,
      listLevel: isBullet ? 0 : null,
      headingStyle:false
    });
  });
  return blocks;
}

/* ==========================================================================
   שלב 2: בניית מתאר (Outline) — זיהוי כותרות, רמות רשימה, ומסלול כותרת לכל בלוק
   ========================================================================== */
function isHeadingBlock(b){
  if(b.type!=='p') return false;
  var t = (b.text||'').trim();
  if(t.length===0 || t.length>70) return false;
  if(b.headingStyle) return true;
  if(b.bold) return true; /* עיצוב מודגש מלא על כל השורה (inline) */
  var endsSentence = /[.!?]$/.test(t);
  if(!endsSentence && /:$/.test(t)) return true; /* שורה קצרה המסתיימת בנקודתיים — לרוב כותרת/תווית */
  if(!endsSentence && matchCategories(t).length>0) return true; /* השורה עצמה מכילה מילת מפתח של קטגוריה, ואינה משפט מלא */
  return false;
}

function buildOutline(blocks){
  var headingStack = ['מסמך'];
  var listStack = {}; /* level -> טקסט הפריט האחרון שנראה באותה רמה */
  var out = [];
  blocks.forEach(function(b, idx){
    if(isHeadingBlock(b)){
      headingStack = [b.text];
      listStack = {};
      out.push(Object.assign({}, b, {isHeading:true, headingPath: b.text, parentGuess:null, idx:idx}));
      return;
    }
    var headingPath = headingStack[headingStack.length-1];
    var parentGuess = null;
    if(b.type==='p' && b.listLevel!=null){
      var lvl = b.listLevel;
      for(var L=lvl-1; L>=0; L--){
        if(listStack[L]){ parentGuess = listStack[L]; break; }
      }
      listStack[lvl] = b.text;
      /* נקה רמות עמוקות יותר שכבר לא רלוונטיות */
      Object.keys(listStack).forEach(function(k){ if(parseInt(k,10) > lvl) delete listStack[k]; });
    }
    out.push(Object.assign({}, b, {isHeading:false, headingPath: headingPath, parentGuess: parentGuess, idx:idx}));
  });
  return out;
}

/* ==========================================================================
   שלב 3: מילון קטגוריות — מיפוי מילות מפתח בעברית לקטגוריה קנונית
   ========================================================================== */
var CATEGORY_KEYWORDS = {
  goals:               ['מטרת העל','מטרות ביניים','מטרות השיעור','מטרת השיעור','יעדי למידה','יעדי השיעור','מטרות הלמידה'],
  tasks:               ['משימות','משימה'],
  stages:              ['שלבי ביצוע','שלבים בבניית','שלבי התהליך','שלבי העבודה','שלבי הפיתוח','שלבים לתכנון','שלבים בפיתוח'],
  roleComponents:      ['מרכיבי תפקיד','מרכיב תפקיד','מרכיבי התפקיד','מרכיבי תהליך'],
  criteria:            ['קריטריונים','קריטריון'],
  performanceConditions:['תנאי ביצוע','תנאי הביצוע'],
  startConditions:     ['תנאי התחלה','תנאי פתיחה','תנאי פתיחה למשימה'],
  equipment:           ['ציוד','אמצעים נדרשים','אמצעים העומדים'],
  emphases:            ['דגשים מקצועיים','דגש מקצועי','דגשים'],
  commonMistakes:      ['טעויות נפוצות','טעות נפוצה','שגיאות נפוצות'],
  examinerInstructions:['הוראות לבוחן'],
  examineeInstructions:['הוראות לנבחן','הוראות לחניך'],
  instructorInstructions:['הוראות למדריך','כללים למדריך'],
  scoringMethod:       ['שיטת ציינון','שיטת הציינון','שיטת הערכה','אמצעי הערכה'],
  scenario:            ['תרחיש'],
  script:              ['תסריט']
};
var CATEGORY_LABELS = {
  goals:'מטרות ויעדים', tasks:'משימות', stages:'שלבי ביצוע', roleComponents:'מרכיבי תפקיד',
  criteria:'קריטריונים', performanceConditions:'תנאי ביצוע', startConditions:'תנאי התחלה',
  equipment:'ציוד ואמצעים', emphases:'דגשים מקצועיים', commonMistakes:'טעויות נפוצות',
  examinerInstructions:'הוראות לבוחן', examineeInstructions:'הוראות לנבחן',
  instructorInstructions:'הוראות למדריך', scoringMethod:'שיטת ציינון',
  scenario:'תרחיש', script:'תסריט', tables:'טבלאות מהמסמך', uncategorized:'לא מסווג',
  instructorActions:'פעולות מדריך (ממערך השיעור)', lessonTopics:'נושאים וייעודים (ממערך השיעור)',
  teachingAids:'אמצעי המחשה', comprehensionChecks:'בדיקות הבנה', keyPoints:'נקודות עיקריות (מסיכום)',
  lessonSequence:'רצף מערך השיעור',
  derivedCriteria:'קריטריונים מוצעים (נגזרו ממטרות ומפעולות)'
};
var REQUIRED_CATEGORIES = ['roleComponents','criteria','examinerInstructions','examineeInstructions'];
var PAGE_TYPE_LABELS = ['פתיחה','מטרות','תוכן','מערך שיעור','סיכום','נספחים'];
function classifyPageType(headingText, index){
  var h = headingText||'';
  if(index===0) return 'פתיחה';
  if(/מטרת|מטרות|יעד/.test(h)) return 'מטרות';
  if(/סיכום|לסיכום/.test(h)) return 'סיכום';
  if(/נספח/.test(h)) return 'נספחים';
  return 'תוכן';
}

function matchCategories(headingPath){
  var matches = [];
  var h = (headingPath||'');
  Object.keys(CATEGORY_KEYWORDS).forEach(function(cat){
    var kws = CATEGORY_KEYWORDS[cat];
    if(kws.some(function(k){ return h.indexOf(k)!==-1; })) matches.push(cat);
  });
  return matches;
}

var DURATION_RE = /\d+\s*(?:דקות|דק['׳]|שעות|שעה|שניות)/g;
var META_PATTERNS = [
  {key:'courseTitle', re:/(?:לקורס|קורס)\s*[:\-]\s*(.+)/},
  {key:'department',  re:/מדור\s*[:\-]\s*(.+)/},
  {key:'lessonTopic',  re:/(?:בנושא|נושא)\s*[:\-]?\s*(.+)/}
];

/* ==========================================================================
   שלב 4: חילוץ מועמדים לכל קטגוריה, ללא דילוג על תוכן
   ========================================================================== */
function newCandId(){ return 'cand_'+Math.random().toString(36).slice(2,9); }

/* מוסיף קריטריון מוצע לקטגוריית derivedCriteria אם הפסקה מאפשרת גזירה (מטרה או פעולה מזוקקת) */
function pushDerivedCriterion(categories, sem, source){
  if(!sem) return;
  var critText = null, origin = null;
  if(sem.tag==='objective' && sem.derivedCriterion){ critText = sem.derivedCriterion; origin='נגזר ממטרה'; }
  else if(sem.distilledFrom && sem.extract){ critText = sem.extract; origin='זוקק מהסבר'; }
  if(!critText) return;
  /* מניעת כפילויות */
  var norm = critText.replace(/\s+/g,' ').trim();
  var exists = categories.derivedCriteria.some(function(c){ return c.text.replace(/\s+/g,' ').trim()===norm; });
  if(exists) return;
  categories.derivedCriteria.push({
    id:newCandId(), text:critText, source:source, origin:origin,
    original: sem.distilledFrom || (sem.tag==='objective'?sem.extract:null),
    selected:false, edited:false, semTag:'derived', semReason:sem.reason
  });
}

function extractCandidates(outlineBlocks){
  var categories = {};
  Object.keys(CATEGORY_LABELS).forEach(function(k){ categories[k] = []; });
  var meta = {courseTitle:'', department:'', lessonTopic:'', durationCandidates:[]};
  var genericTree = [];
  var pageTypesMap = {}; /* headingPath -> {type, order} */
  var headingOrder = [];
  var lessonTimesAll = [];

  var firstBoldSeen = [];
  outlineBlocks.forEach(function(b){
    if(b.type==='p' && b.bold && firstBoldSeen.length<3){ firstBoldSeen.push(b.text); }
  });
  if(firstBoldSeen.length){ meta.lessonTopic = meta.lessonTopic || firstBoldSeen[0]; }

  function registerHeading(h){
    if(pageTypesMap[h]) return pageTypesMap[h];
    var idx = headingOrder.length;
    headingOrder.push(h);
    var pt = classifyPageType(h, idx);
    pageTypesMap[h] = {type:pt, order:idx};
    return pageTypesMap[h];
  }
  registerHeading('מסמך');

  outlineBlocks.forEach(function(b){
    var textForMeta = b.text||'';
    META_PATTERNS.forEach(function(mp){
      var mm = textForMeta.match(mp.re);
      if(mm && !meta[mp.key]) meta[mp.key] = mm[1].trim();
    });
    var durMatches = textForMeta.match(DURATION_RE);
    if(durMatches) durMatches.forEach(function(d){ if(meta.durationCandidates.indexOf(d)===-1) meta.durationCandidates.push(d); });

    if(b.isHeading){ registerHeading(b.text); return; }
    var pageInfo = registerHeading(b.headingPath);

    if(b.type==='table'){
      var lessonCls = classifyLessonTable(b.rows);
      if(lessonCls.isLessonTable){
        pageInfo.type = 'מערך שיעור';
        var extracted = extractLessonTableRows(b.rows, lessonCls.columnRoles, lessonCls.headerRow);
        categories.instructorActions = categories.instructorActions.concat(extracted.instructorActions);
        categories.lessonTopics = categories.lessonTopics.concat(extracted.lessonTopics);
        categories.teachingAids = categories.teachingAids.concat(extracted.teachingAids);
        categories.comprehensionChecks = categories.comprehensionChecks.concat(extracted.comprehensionChecks);
        lessonTimesAll = lessonTimesAll.concat(extracted.lessonTimes);
        extracted.lessonSequence.forEach(function(seq){
          var label = (seq.minutes!=null?('['+seq.minutes+' דק׳] '):'')+(seq.ieud?('ייעוד: '+seq.ieud):('שלב '+seq.row))+
            (seq.actions.length?(' — '+seq.actions.length+' פעולות מדריך'):'');
          categories.lessonSequence.push({id:newCandId(), text:label, source:'מערך שיעור', selected:true, edited:false, meta:seq});
        });
        var rowsText = b.rows.map(function(r){return r.join(' | ');}).join(' ;; ');
        categories.tables.push({id:newCandId(), type:'table', rows:b.rows, text:rowsText, source:b.headingPath+' (מערך שיעור)', selected:true, edited:false});
        return;
      }
      var cats = matchCategories(b.headingPath);
      var rowsText2 = b.rows.map(function(r){return r.join(' | ');}).join(' ;; ');
      var item = {id:newCandId(), type:'table', rows:b.rows, text: rowsText2, source:b.headingPath, selected:true, edited:false};
      categories.tables.push(item);
      if(cats.length===0){
        categories.uncategorized.push(Object.assign({}, item, {id:newCandId()}));
      } else {
        cats.forEach(function(c){ categories[c].push(Object.assign({}, item, {id:newCandId()})); });
      }
      return;
    }

    var text = b.text.trim();
    if(!text) return;
    var cats = matchCategories(b.headingPath);

    /* ניתוח סמנטי של הפסקה — מבין את תפקידה במקום להעתיק אותה */
    var sem = classifyParagraphSemantics(text);

    if(pageInfo.type==='סיכום'){
      if(sem && sem.tag==='question'){
        categories.comprehensionChecks.push({id:newCandId(), text:text, source:b.headingPath, selected:true, edited:false, semTag:sem.tag, semReason:sem.reason});
      } else if(sem && sem.tag==='theory'){
        /* הסבר תאורטי בסיכום — נשמר כנקודה עיקרית אך מסומן ולא נגזר לקריטריון */
        categories.keyPoints.push({id:newCandId(), text:text, source:b.headingPath, selected:true, edited:false, semTag:sem.tag, semReason:sem.reason});
      } else {
        categories.keyPoints.push({id:newCandId(), text:text, source:b.headingPath, selected:true, edited:false, semTag:sem?sem.tag:null, semReason:sem?sem.reason:null});
      }
      /* גזירת קריטריון גם מפריטי סיכום מתאימים */
      pushDerivedCriterion(categories, sem, b.headingPath);
      return;
    }

    if(cats.indexOf('roleComponents')!==-1 || cats.indexOf('criteria')!==-1){
      /* איתור קריטריון עצמאי בר-הערכה (מכיל "האם"/"עד כמה" וכד') גם כשהוא ברמה 0 —
         כך שלא ייווצר "מרכיב תפקיד" ריק ללא קריטריונים תחתיו בדף התצפית */
      var looksLikeSelfContainedCriterion = /(^|\s)(האם|עד כמה)(\s|$)/.test(text) && text.length<200;
      if((b.listLevel===0 || b.listLevel==null) && !looksLikeSelfContainedCriterion){
        categories.roleComponents.push({id:newCandId(), text:text, source:b.headingPath, selected:true, edited:false, semTag:sem?sem.tag:null, semReason:sem?sem.reason:null});
      } else {
        categories.criteria.push({id:newCandId(), text:text, source:b.headingPath, parentGuess:b.parentGuess||b.headingPath, selected:true, edited:false, semTag:sem?sem.tag:null, semReason:sem?sem.reason:null});
      }
      return;
    }

    if(cats.length>0){
      cats.forEach(function(c){
        categories[c].push({id:newCandId(), text:text, source:b.headingPath, selected:true, edited:false, semTag:sem?sem.tag:null, semReason:sem?sem.reason:null});
      });
      pushDerivedCriterion(categories, sem, b.headingPath);
      return;
    }

    /* פסקה ללא כותרת מוכרת — מנותבת לפי הסיווג הסמנטי */
    if(sem){
      pushDerivedCriterion(categories, sem, b.headingPath);
      if(sem.tag==='action_examiner'){
        categories.instructorActions.push({id:newCandId(), text:sem.extract, verb:sem.verb, source:b.headingPath, selected:true, edited:false, semTag:sem.tag, semReason:sem.reason});
        return;
      }
      if(sem.tag==='question'){
        categories.comprehensionChecks.push({id:newCandId(), text:text, source:b.headingPath, selected:true, edited:false, semTag:sem.tag, semReason:sem.reason});
        return;
      }
      if(sem.tag==='condition'){
        categories.performanceConditions.push({id:newCandId(), text:text, source:b.headingPath, selected:true, edited:false, semTag:sem.tag, semReason:sem.reason});
        return;
      }
      if(sem.tag==='instruction'){
        categories.instructorInstructions.push({id:newCandId(), text:text, source:b.headingPath, selected:false, edited:false, semTag:sem.tag, semReason:sem.reason});
        return;
      }
      /* theory / factual / objective — נשמר ב"לא מסווג" עם תגית, לא מועתק כקריטריון */
      categories.uncategorized.push({id:newCandId(), text:text, source:b.headingPath, selected:false, edited:false, semTag:sem.tag, semReason:sem.reason});
      return;
    }

    if(b.listLevel!=null && b.listLevel>0 && b.parentGuess){
      genericTree.push({id:newCandId(), text:text, source:b.headingPath, parentGuess:b.parentGuess, selected:false, edited:false});
    }
    categories.uncategorized.push({id:newCandId(), text:text, source:b.headingPath, selected:false, edited:false});
  });

  var pageTypesSummary = {};
  PAGE_TYPE_LABELS.forEach(function(t){ pageTypesSummary[t] = false; });
  Object.keys(pageTypesMap).forEach(function(h){ pageTypesSummary[pageTypesMap[h].type] = true; });
  var totalMinutes = lessonTimesAll.reduce(function(s,t){return s+(t.minutes||0);}, 0);

  /* זיהוי סוג התיק: מבחן מעשי מפורש מול תיק הדרכה כללי שממנו יש לגזור */
  var explicitExamContent = categories.roleComponents.length + categories.criteria.length +
                            categories.scenario.length + categories.examinerInstructions.length;
  var lessonContent = categories.goals.length + categories.instructorActions.length +
                      categories.lessonTopics.length + categories.derivedCriteria.length;
  var docType, docTypeNote;
  if(explicitExamContent >= 3){
    docType = 'exam';
    docTypeNote = 'זוהה תיק מבחן מעשי — נמצאו מרכיבי תפקיד, קריטריונים, תרחיש או הוראות בוחן במפורש.';
  } else if(lessonContent >= 3){
    docType = 'lesson';
    docTypeNote = 'זוהה תיק הדרכה על נושא לימוד (לא תיק מבחן מעשי). לא נמצאו קריטריונים/תרחיש/מרכיבי תפקיד במפורש — הם אינם קיימים בתיק מסוג זה. במקום זאת המערכת גזרה קריטריונים מוצעים ממטרות הלמידה ומפעולות המדריך (ראה קטגוריית "קריטריונים מוצעים").';
  } else {
    docType = 'unknown';
    docTypeNote = 'לא ניתן היה לקבוע בוודאות את סוג התיק. עבור/י על הקטגוריות וסמן/י ידנית את הרלוונטי.';
  }

  return {categories:categories, meta:meta, genericTree:genericTree, pageTypes:pageTypesSummary, lessonTimes:lessonTimesAll, totalLessonMinutes:Math.round(totalMinutes*10)/10, docType:docType, docTypeNote:docTypeNote};
}

/* ==========================================================================
   API ציבורי: ניתוח קובץ (docx / pdf) -> אובייקט extracted
   ========================================================================== */
function analyzeDocxArrayBuffer(buf){
  var files = fflate.unzipSync(new Uint8Array(buf));
  if(!files['word/document.xml']) throw new Error('הקובץ אינו מסמך Word תקין (חסר word/document.xml)');
  var xml = fflate.strFromU8(files['word/document.xml']);
  var blocks = parseDocxBlocks(xml);
  if(blocks.length===0) throw new Error('לא נמצא תוכן טקסטואלי במסמך');
  var outline = buildOutline(blocks);
  var result = extractCandidates(outline);
  result.blockCount = blocks.length;
  result.fileType = 'docx';
  return result;
}
function analyzePdfArrayBuffer(buf){
  var blocks = parsePdfBlocks(buf);
  if(blocks.length===0) throw new Error('לא הצלחתי לחלץ טקסט מקובץ ה-PDF (ייתכן שמדובר בסריקה/תמונה ולא בטקסט אמיתי)');
  var outline = buildOutline(blocks);
  var result = extractCandidates(outline);
  result.blockCount = blocks.length;
  result.fileType = 'pdf';
  result.lowConfidence = true;
  return result;
}

/* ==========================================================================
   מנוע ייעודי לטבלת "מערך שיעור" (זרוע היבשה)
   במקום חיפוש מילים במסמך, מזהים תפקיד עמודה בטבלה ומנתחים לפי מבנה, לא לפי תוכן.
   ========================================================================== */

var COLUMN_ROLE_KEYWORDS = {
  time:    ['זמן','זמנים','דקות','חלוקת זמנים','משך זמן','משך'],
  stage:   ['שלב','ייעוד','שי"ח','שיח'],
  actions: ['פעולות המדריך','פעולת המדריך','פעולות מדריך','פעולות המורה'],
  content: ['תוכן','שקופית','מצגת','נושא ההוראה'],
  aids:    ['אמצעי המחשה','אמצעים','עזרי המחשה','עזרים','אמל"ח הדרכתי'],
  notes:   ['הערות','הערה']
};

function cellMatchesRoles(cellText){
  var roles = [];
  var t = (cellText||'');
  Object.keys(COLUMN_ROLE_KEYWORDS).forEach(function(role){
    if(COLUMN_ROLE_KEYWORDS[role].some(function(k){ return t.indexOf(k)!==-1; })) roles.push(role);
  });
  return roles;
}

/* פרסר לביטויי זמן בעברית (חצי דקה / דקה וחצי / 2 דק / 20 דקות / רבע שעה וכו') */
function parseHebrewDuration(text){
  if(!text) return null;
  var t = text;
  if(/רבע\s*שעה/.test(t)) return 15;
  if(/שעה\s*וחצי/.test(t)) return 90;
  if(/חצי\s*שעה/.test(t)) return 30;
  var hm = t.match(/(\d+(?:\.\d+)?)\s*שע(?:ה|ות)/);
  if(hm) return parseFloat(hm[1])*60;
  if(/חצי\s*דקה/.test(t)) return 0.5;
  if(/דקה\s*וחצי/.test(t)) return 1.5;
  var mm = t.match(/(\d+(?:\.\d+)?)\s*דק/);
  if(mm) return parseFloat(mm[1]);
  if(/\bדקה\b/.test(t)) return 1;
  if(/\bשעה\b/.test(t)) return 60;
  return null;
}

/* זוגות פועלי הנחיה למדריך (זכר/נקבה) — לשימוש בזיהוי שורות פעולה, לא לחיפוש חופשי */
var ACTION_VERB_PAIRS = [
  ['שאל','שאלי'], ['הצג','הציגי'], ['הצג','הצגי'], ['הסבר','הסבירי'], ['תרגל','תרגלי'],
  ['הדגם','הדגימי'], ['בקש','בקשי'], ['בדוק','בדקי'], ['סכם','סכמי'], ['סכם','סכמי'],
  ['חשוף','חשפי'], ['הקרא','הקריאי'], ['הקרא','הקראי'], ['סקור','סקרי'], ['עבור','עברי'],
  ['הדגש','הדגישי'], ['השתמש','השתמשי'], ['הזכר','הזכירי'], ['צייר','ציירי'],
  ['ספר','ספרי'], ['הפנה','הפני'], ['חלק','חלקי'], ['בצע','בצעי'],
  ['חשוף','חשופי'], ['הראה','הראי'], ['כתוב','כתבי'], ['קרא','קראי'],
  ['ודא','ודאי'], ['וודא','וודאי'], ['שאל','שאלו'], ['חזור','חזרי']
];
var ACTION_VERB_RE = new RegExp('^\\s*('+ACTION_VERB_PAIRS.map(function(p){return p.join('|');}).join('|')+')(?=[\\s.,:;\\-]|$)');

function extractVerb(line){
  var m = line.match(ACTION_VERB_RE);
  if(!m) return null;
  var found = m[1];
  var pair = ACTION_VERB_PAIRS.filter(function(p){ return p.indexOf(found)!==-1; })[0];
  return pair ? pair[0] : found; /* מנרמל לצורת הזכר לצורך תיוג אחיד */
}

/* זיהוי טבלת "מערך שיעור" לפי כותרת עמודות, ואם אין כותרת ברורה — לפי תבנית תוכן */
function classifyLessonTable(rows){
  if(!rows || rows.length<2) return {isLessonTable:false};
  var header = rows[0];
  var colRoles = {}; /* colIndex -> [roles] */
  header.forEach(function(cell, idx){
    var roles = cellMatchesRoles(cell);
    if(roles.length) colRoles[idx] = roles;
  });
  var matchedRoleSet = {};
  Object.keys(colRoles).forEach(function(idx){ colRoles[idx].forEach(function(r){ matchedRoleSet[r]=idx; }); });

  if(Object.keys(matchedRoleSet).length>=2 && (matchedRoleSet.actions!=null || matchedRoleSet.time!=null)){
    return {isLessonTable:true, columnRoles:matchedRoleSet, headerRow:0, confidence:'header'};
  }

  /* גיבוי: אין כותרת ברורה — בדוק לפי תוכן הפועלים והזמנים בעמודות */
  var dataRows = rows.slice(1);
  var colCount = header.length;
  var verbScores = [], timeScores = [];
  for(var c=0;c<colCount;c++){
    var verbHits=0, timeHits=0, nonEmpty=0;
    dataRows.forEach(function(r){
      var cell = r[c]||'';
      if(!cell.trim()) return;
      nonEmpty++;
      var lines = cell.split('\n');
      if(lines.some(function(l){return ACTION_VERB_RE.test(l);})) verbHits++;
      if(parseHebrewDuration(cell)!=null) timeHits++;
    });
    verbScores[c] = nonEmpty>0 ? verbHits/nonEmpty : 0;
    timeScores[c] = nonEmpty>0 ? timeHits/nonEmpty : 0;
  }
  var bestActionsCol = verbScores.indexOf(Math.max.apply(null, verbScores));
  var bestTimeCol = timeScores.indexOf(Math.max.apply(null, timeScores));
  if(verbScores[bestActionsCol] >= 0.4){
    var fallbackRoles = {actions:bestActionsCol};
    if(timeScores[bestTimeCol] >= 0.3) fallbackRoles.time = bestTimeCol;
    return {isLessonTable:true, columnRoles:fallbackRoles, headerRow:null, confidence:'content'};
  }
  return {isLessonTable:false};
}

/* חילוץ שורות מתוך טבלת מערך שיעור מסווגת — לפי מבנה העמודות, לא לפי חיפוש מילים */
function extractLessonTableRows(rows, columnRoles, headerRow){
  var result = {lessonSequence:[], instructorActions:[], comprehensionChecks:[], lessonTopics:[], teachingAids:[], lessonTimes:[]};
  var startRow = (headerRow===0) ? 1 : 0;
  var lastStage = null;

  for(var r=startRow; r<rows.length; r++){
    var row = rows[r];
    var timeCellRaw = columnRoles.time!=null ? (row[columnRoles.time]||'') : '';
    var actionsCellRaw = columnRoles.actions!=null ? (row[columnRoles.actions]||'') : '';
    var contentCellRaw = columnRoles.content!=null ? (row[columnRoles.content]||'') : '';
    var aidsCellRaw = columnRoles.aids!=null ? (row[columnRoles.aids]||'') : '';

    if(!timeCellRaw && !actionsCellRaw && !contentCellRaw && !aidsCellRaw) continue;

    /* שלב + ייעוד + זמן, בדרך כלל מגיעים יחד בעמודת השי"ח */
    var stageMatch = timeCellRaw.match(/שלב[\s\-–]*([^\n]+)/);
    if(stageMatch) lastStage = stageMatch[1].trim();
    var ieudMatch = timeCellRaw.match(/ייעוד[\s\-–]*([^\n]+)/);
    var ieud = ieudMatch ? ieudMatch[1].trim() : null;
    var minutes = parseHebrewDuration(timeCellRaw);
    if(minutes!=null) result.lessonTimes.push({minutes:minutes, stage:lastStage, ieud:ieud, row:r});
    if(ieud) result.lessonTopics.push({id:newCandId(), text:ieud, source:'מערך שיעור — '+(lastStage||'שלב'), selected:true, edited:false});

    /* פעולות המדריך: פירוק לשורות, זיהוי פועל, וזיהוי זוגות שאלה/תשובה */
    var actionLines = actionsCellRaw.split('\n').map(function(l){return l.trim();}).filter(Boolean);
    var pendingQuestion = null;
    actionLines.forEach(function(line){
      var qMatch = line.match(/^שאלה\s*[:\-–]\s*(.+)/);
      var aMatch = line.match(/^תשובה\s*[:\-–]\s*(.+)/);
      if(qMatch){ pendingQuestion = qMatch[1].trim(); return; }
      if(aMatch && pendingQuestion){
        result.comprehensionChecks.push({id:newCandId(), text:'שאלה: '+pendingQuestion+'  |  תשובה: '+aMatch[1].trim(), source:'מערך שיעור — בדיקת הבנה ('+(lastStage||ieud||'')+')', selected:true, edited:false});
        pendingQuestion = null;
        return;
      }
      if(aMatch && !pendingQuestion){
        result.comprehensionChecks.push({id:newCandId(), text:'תשובה: '+aMatch[1].trim(), source:'מערך שיעור', selected:true, edited:false});
        return;
      }
      var verb = extractVerb(line);
      result.instructorActions.push({
        id:newCandId(), text:line, verb:verb, stage:lastStage, ieud:ieud,
        source:'מערך שיעור — '+(ieud||lastStage||'שלב '+r), selected:true, edited:false
      });
    });

    if(contentCellRaw){
      contentCellRaw.split('\n').map(function(l){return l.trim();}).filter(Boolean).forEach(function(l){
        result.lessonTopics.push({id:newCandId(), text:l, source:'מערך שיעור — עמודת תוכן', selected:true, edited:false});
      });
    }
    if(aidsCellRaw){
      aidsCellRaw.split('\n').map(function(l){return l.trim();}).filter(Boolean).forEach(function(l){
        result.teachingAids.push({id:newCandId(), text:l, source:'מערך שיעור — אמצעי המחשה', selected:true, edited:false});
      });
    }

    result.lessonSequence.push({
      id:newCandId(), row:r, stage:lastStage, ieud:ieud, minutes:minutes,
      actions: actionLines, selected:true
    });
  }
  return result;
}

/* ==========================================================================
   מנוע סיווג סמנטי מבוסס-כללים (ללא AI, ללא אינטרנט)
   מטרתו: להבין את *תפקיד* הפסקה במקום להעתיק אותה. כל פסקה מסווגת לאחד מ:
     action_examinee | action_examiner | instruction | condition | theory | question | objective
   ומתוך פסקאות שאינן "העתקה גרידא" מזוקקת פעולה/אופן בדיקה בר-הערכה.
   כל תוצר נושא תגית גלויה (semTag) כדי שהמשתמש יראה את החלטת המערכת ויוכל לתקן.
   ========================================================================== */

var SEM_TAG_LABELS = {
  action_examinee: 'פעולת נבחן',
  action_examiner: 'פעולת בוחן/מדריך',
  instruction:     'הוראה',
  condition:       'תנאי לביצוע',
  theory:          'הסבר תאורטי',
  question:        'שאלה / בדיקת הבנה',
  objective:       'מטרה / יעד',
  factual:         'מידע עובדתי'
};

/* פעלים בגוף שלישי / עתיד המציינים פעולת נבחן ("החניך יגדיר", "הנבחן יבצע", "יזהה", "ידווח")
   הערה: לא משתמשים ב-\b כי הוא אינו עובד על אותיות עבריות ב-JS */
var EXAMINEE_SUBJECTS = ['החניך','הנבחן','החניכה','הנבחנת','הלומד','התלמיד','המתאמן'];
var EXAMINEE_FUTURE_VERB_RE = /(^|\s)[ית][א-ת]{2,}(\s|$)/;

/* מילות פתיחה של תנאי */
var CONDITION_STARTERS = [
  /^לפני\s+ש/, /^לאחר\s+ש/, /^בתנאי\s+ש/, /^רק\s+כאשר/, /^רק\s+לאחר/, /^כאשר\s/, /^במידה\s+ו/, /^אם\s/, /^בהינתן/, /^בזמן\s+ש/
];
/* מילות פתיחה / ניסוח של הוראה */
var INSTRUCTION_MARKERS = [
  /^יש\s+ל/, /^חובה/, /^אין\s+ל/, /^הקפד/, /^הקפידי/, /^שים\s+לב/, /^שימי\s+לב/, /^זכור/, /^זכרי/, /^חשוב\s+ל/, /^מומלץ\s+ל/, /^נדרש\s+ל/, /^עליך\s+ל/, /^על\s+המדריך/, /^על\s+הבוחן/
];
/* ניסוחים המעידים על הסבר תאורטי (הגדרה, "מטרת X היא", "נועד ל", תיאור כללי)
   הערה: לא משתמשים ב-\b (אינו עובד על עברית); משתמשים ברווח/גבול-מחרוזת מפורשים */
var THEORY_MARKERS = [
  /(^|\s)הוא\s/, /(^|\s)היא\s/, /(^|\s)הם\s/, /מטרת/, /נועד/, /מתחלק/, /מוגדר/, /משמעות/, /(^|\s)כלומר/, /(^|\s)למשל/, /לדוגמ/, /מראה\s+כיצד/, /מתייחס/, /מבוסס\s+על/
];
/* פעלים המצביעים על פעולת בוחן/מדריך אם מופיעים כציווי בתחילת השורה — משתמשים ב-ACTION_VERB_PAIRS הקיים */

function stripBullet(text){
  return (text||'').replace(/^\s*([•\-\*◦]|\d+[\.\)]|[א-ת][\.\)])\s*/,'').trim();
}

function detectQuestion(text){
  var t = (text||'').trim();
  if(/\?\s*$/.test(t)) return true;
  /* מילות שאלה בתחילת המשפט בלבד, עם דרישת גבול מילה (רווח/סוף) כדי שלא יתפסו
     מילים מקריות כמו "מהווה" (המתחילה כמו "מהו" אך אינה שאלה) */
  if(/^(שאל|שאלי|האם|מה|מהו|מהי|מדוע|כיצד|למה|כמה)(\s|$)/.test(t)) return true;
  /* ביטויי "וודא/י הבנה" רק כאשר הם פותחים את המשפט — לא כשהם מופיעים אגב אורחא
     בתוך פסקה תיאורית ארוכה (למשל "...כדי לוודא שלכלל המדריכים...") */
  if(/^(בדיקת הבנה|וידוא הבנה|וודא(י|ו)?\s+(כי|ש)|ודאי\s+(כי|ש))/.test(t)) return true;
  return false;
}

/* הסבר מדוע פסקה סווגה כך — שקיפות למשתמש */
function classifyParagraphSemantics(rawText){
  var text = stripBullet(rawText);
  if(!text || text.length<2) return null;
  var wordCount = text.split(/\s+/).length;

  /* 1) שאלה / בדיקת הבנה */
  if(detectQuestion(text)){
    return {tag:'question', extract:text, reason:'זוהתה שאלה או בדיקת הבנה (סימן שאלה או מילת שאלה).'};
  }

  /* 2) מטרה / יעד — "החניך י..." בהקשר של מטרות */
  var startsExamineeSubject = EXAMINEE_SUBJECTS.some(function(s){ return text.indexOf(s)===0; });
  if(startsExamineeSubject && EXAMINEE_FUTURE_VERB_RE.test(text)){
    /* "החניך יגדיר / יכיר / יפעל" — מטרת ביניים שממנה ניתן לגזור קריטריון */
    var derived = deriveCriterionFromObjective(text);
    return {tag:'objective', extract:text, derivedCriterion:derived, reason:'משפט מטרה/יעד (נושא: הנבחן/החניך + פועל עתיד). ניתן לגזור ממנו קריטריון בר-הערכה.'};
  }

  /* 3) תנאי לביצוע */
  for(var i=0;i<CONDITION_STARTERS.length;i++){
    if(CONDITION_STARTERS[i].test(text)){
      return {tag:'condition', extract:text, reason:'משפט תנאי (נפתח במילת תנאי כגון "לפני ש/לאחר ש/כאשר").'};
    }
  }

  /* 4) פעולת בוחן/מדריך — ציווי בתחילת השורה */
  var verb = extractVerb(text);
  if(verb){
    return {tag:'action_examiner', verb:verb, extract:text, reason:'נפתח בפועל הנחיה בציווי ("'+verb+'") — פעולה שהבוחן/מדריך מבצע.'};
  }

  /* 5) הוראה */
  for(var j=0;j<INSTRUCTION_MARKERS.length;j++){
    if(INSTRUCTION_MARKERS[j].test(text)){
      return {tag:'instruction', extract:text, reason:'ניסוח הוראה ("יש ל/חובה/הקפד/עליך ל" וכד\').'};
    }
  }

  /* 6) הסבר תאורטי — לזהות, ולנסות לזקק ממנו פעולה נסתרת */
  var looksTheory = THEORY_MARKERS.some(function(re){ return re.test(text); });
  if(looksTheory){
    var distilled = distillActionFromExplanation(text);
    if(distilled){
      return {tag:'action_examinee', extract:distilled.action, distilledFrom:text, reason:'זוהה כהסבר תאורטי, אך זוקקה ממנו פעולה בת-הערכה: "'+distilled.action+'".'};
    }
    return {tag:'theory', extract:text, reason:'הסבר תאורטי בלבד (הגדרה/תיאור). לא הועתק כפריט הערכה.'};
  }

  /* 7) ניסיון זיקוק פעולה נסתרת מכל פסקה שנותרה (גם קצרה) */
  var distilled2 = distillActionFromExplanation(text);
  if(distilled2){
    return {tag:'action_examinee', extract:distilled2.action, distilledFrom:text, reason:'זוקקה פעולה בת-הערכה מתוך הפסקה: "'+distilled2.action+'".'};
  }

  /* 8) ברירת מחדל — מידע עובדתי קצר (למשל "מיקום: כיתה") */
  if(wordCount<=12){
    return {tag:'factual', extract:text, reason:'מידע עובדתי קצר, ללא פעולה או תנאי מזוהים.'};
  }
  /* פסקה ארוכה ללא סימן מובהק — מטופלת כהסבר, לא מועתקת כקריטריון */
  return {tag:'theory', extract:text, reason:'פסקה תיאורית ללא פעולה מזוהה — לא הועתקה כקריטריון.'};
}

/* גזירת קריטריון בר-צפייה ממטרת ביניים:
   "החניך יגדיר מהי יחידת לימוד" -> "הנבחן הגדיר נכון מהי יחידת לימוד" */
var OBJECTIVE_VERB_MAP = {
  'יגדיר':'הגדיר נכון', 'יכיר':'זיהה/מנה נכון', 'יפעל':'פעל נכון', 'יבצע':'ביצע נכון',
  'ידע':'הדגים ידע ב', 'יבין':'הסביר נכון', 'ייישם':'יישם נכון', 'יישם':'יישם נכון',
  'יזהה':'זיהה נכון', 'ידגים':'הדגים נכון', 'יסביר':'הסביר נכון', 'ימנה':'מנה נכון',
  'יבנה':'בנה נכון', 'יארגן':'ארגן נכון', 'יתכנן':'תכנן נכון', 'יכתוב':'כתב נכון',
  'יציג':'הציג נכון', 'ינתח':'ניתח נכון', 'יישום':'יישם נכון'
};
function deriveCriterionFromObjective(text){
  var t = stripBullet(text);
  /* הסר את הנושא (החניך/הנבחן) */
  var withoutSubject = t.replace(new RegExp('^('+EXAMINEE_SUBJECTS.join('|')+')\\s+'), '');
  var m = withoutSubject.match(/^(\S+)\s*(.*)$/);
  if(!m) return null;
  var verb = m[1], rest = m[2];
  var mapped = OBJECTIVE_VERB_MAP[verb];
  if(mapped){
    return ('הנבחן ' + mapped + (rest ? ' ' + rest : '')).replace(/\s+/g,' ').trim();
  }
  /* פועל עתיד לא ממופה — ניסוח גנרי שמור */
  if(/^י[א-ת]{2,}$/.test(verb) || /^ת[א-ת]{2,}$/.test(verb)){
    return ('הנבחן הדגים יכולת: ' + withoutSubject).trim();
  }
  return null;
}

/* זיקוק פעולה נסתרת מהסבר:
   "חשוב שהחניכים יבינו כל שלב" -> פעולה: "וידא הבנת החניכים בכל שלב"
   התבניות מכוונות לניסוחים צבאיים נפוצים; לא מכסה כל ניסוח. */
var DISTILL_PATTERNS = [
  {re:/חשוב\s+(?:מאוד\s+)?(?:ש|ל)(.+)/, build:function(m){ return 'ודא ש'+cleanTail(m[1]); }},
  {re:/יש\s+לוודא\s+(?:כי\s+|ש)?(.+)/, build:function(m){ return 'ודא ש'+cleanTail(m[1]); }},
  {re:/עלינו\s+ל(.+)/, build:function(m){ return capVerb(m[1]); }},
  {re:/נשאף\s+ל(.+)/, build:function(m){ return capVerb(m[1]); }},
  {re:/מטרת\s+ה?\S+\s+(?:היא|הוא)\s+ל?(.+)/, build:function(m){ return capVerb(m[1]); }}
];
function cleanTail(s){ return s.replace(/[.,:;].*$/,'').replace(/\s+/g,' ').trim(); }
function capVerb(s){ return cleanTail(s); }
function distillActionFromExplanation(text){
  var t = stripBullet(text);
  for(var i=0;i<DISTILL_PATTERNS.length;i++){
    var m = t.match(DISTILL_PATTERNS[i].re);
    if(m){
      var action = DISTILL_PATTERNS[i].build(m);
      if(action && isQualityAction(action)) return {action:action};
    }
  }
  return null;
}

/* מסנן זיקוקים באיכות ירודה — שברי משפט, מסתיים במילת קישור, או קצר/כללי מדי */
function isQualityAction(action){
  if(!action) return false;
  var wc = action.split(/\s+/).length;
  if(wc < 3 || wc > 20) return false;
  if(action.length < 8) return false;
  /* מסתיים במילת קישור/מילת יחס — סימן לשבר משפט */
  if(/(את|של|עם|כדי|על|אל|כך|הם|היא|הוא|כי|ל|ב|ה|ו)$/.test(action.trim())) return false;
  /* ניסוחים כלליים חסרי ערך הערכתי */
  if(/^ודא שהם\b/.test(action) || /^ודא שלמוד/.test(action)) return false;
  return true;
}

function uid(prefix){ return (prefix||'id')+'_'+Math.random().toString(36).slice(2,9); }

function esc(s){
  if(s===undefined || s===null) return '';
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }

var toastTimer=null;
function toast(msg){
  var el = document.getElementById('toast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2600);
}

function tokenize(s){
  return (s||'').replace(/[^\u0590-\u05FFa-zA-Z0-9\s]/g,'').split(/\s+/).filter(Boolean);
}
function jaccard(a,b){
  var ta = {}, tb = {};
  tokenize(a).forEach(function(t){ta[t]=1;});
  tokenize(b).forEach(function(t){tb[t]=1;});
  var keysA = Object.keys(ta), keysB = Object.keys(tb);
  if(keysA.length===0 || keysB.length===0) return 0;
  var inter=0;
  keysA.forEach(function(k){ if(tb[k]) inter++; });
  var unionSet = {};
  keysA.forEach(function(k){unionSet[k]=1;});
  keysB.forEach(function(k){unionSet[k]=1;});
  var unionSize = Object.keys(unionSet).length;
  return unionSize===0 ? 0 : inter/unionSize;
}

function findAmbiguous(text){
  var t = text||'';
  return AMBIGUOUS_WORDS.filter(function(w){ return t.indexOf(w) !== -1; });
}

function recommendScoringType(text){
  var t = text||'';
  var scaleHints = ['רמת','איכות','מהירות','דיוק','מספר','אחוז','זמן ביצוע'];
  var binaryHints = ['עצר','ביצע','לא ביצע','זיהה','דיווח','פנה','ננעל','חבש','הרים ידיים','כן/לא','נעל'];
  for(var i=0;i<scaleHints.length;i++){ if(t.indexOf(scaleHints[i])!==-1) return 'scale'; }
  for(var j=0;j<binaryHints.length;j++){ if(t.indexOf(binaryHints[j])!==-1) return 'dichotomous'; }
  return 'scored';
}

function allCriteria(st){
  var out = [];
  (st.roleComponents||[]).forEach(function(rc){
    (rc.criteria||[]).forEach(function(c){ out.push({rc:rc, crit:c}); });
  });
  return out;
}

function findDuplicateCriteria(st){
  var all = allCriteria(st);
  var dups = [];
  for(var i=0;i<all.length;i++){
    for(var j=i+1;j<all.length;j++){
      var ta = all[i].crit.text||'', tb = all[j].crit.text||'';
      if(ta.trim().length<3 || tb.trim().length<3) continue;
      var sim = jaccard(ta,tb);
      if(sim>=0.6){ dups.push({a:all[i], b:all[j], sim:sim}); }
    }
  }
  return dups;
}

function totalWeight(st){
  var sum = 0;
  allCriteria(st).forEach(function(x){ sum += (parseFloat(x.crit.weight)||0); });
  if(st.complicating.enabled){
    st.complicating.factors.forEach(function(f){ sum += (parseFloat(f.weight)||0); });
  }
  return Math.round(sum*10)/10;
}

function todayStr(){
  var d = new Date();
  function p(n){return String(n).padStart(2,'0');}
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();
}

/* ---------- גישה כללית למצב לפי נתיב (data-bind) ---------- */
function getByPath(obj, path){
  var parts = path.split('.');
  var cur = obj;
  for(var i=0;i<parts.length;i++){
    if(cur==null) return undefined;
    if(Array.isArray(cur)){
      cur = cur.filter(function(x){return String(x.id)===String(parts[i]);})[0];
    } else {
      cur = cur[parts[i]];
    }
  }
  return cur;
}
function setByPath(obj, path, value){
  var parts = path.split('.');
  var cur = obj;
  for(var i=0;i<parts.length-1;i++){
    if(Array.isArray(cur)){
      cur = cur.filter(function(x){return String(x.id)===String(parts[i]);})[0];
    } else {
      cur = cur[parts[i]];
    }
    if(cur==null) return;
  }
  var last = parts[parts.length-1];
  if(Array.isArray(cur)) return;
  cur[last] = value;
}

/* ---------- מנוע כללים (Rule Engine) — ללא AI, לפי "כללי איכות" מתיק המדריך ---------- */
function computeChecklist(st){
  var items = [];
  var all = allCriteria(st);
  var critCount = all.length;

  var dups = findDuplicateCriteria(st);
  items.push({
    id:'no_overlap', title:'הקריטריונים אינם חופפים',
    status: critCount===0 ? 'info' : (dups.length>0 ? 'fail' : 'pass'),
    detail: critCount===0 ? 'טרם הוגדרו קריטריונים.' :
            (dups.length>0 ? ('נמצאו '+dups.length+' זוגות קריטריונים דומים מאוד זה לזה.') : 'לא נמצאו קריטריונים חופפים.'),
    fix: dups.length>0 ? ('לדוגמה: "'+esc(dups[0].a.crit.text)+'" מול "'+esc(dups[0].b.crit.text)+'" — מומלץ למזג לקריטריון אחד ברור, או לחדד את ההבדל ביניהם.') : null
  });

  var measurable = all.filter(function(x){return x.crit.measurable;}).length;
  items.push({
    id:'measurable', title:'הקריטריונים מדידים',
    status: critCount===0 ? 'info' : (measurable===critCount ? 'pass' : (measurable===0?'fail':'warn')),
    detail: critCount===0 ? 'טרם הוגדרו קריטריונים.' : (measurable+' מתוך '+critCount+' קריטריונים סומנו כמדידים.'),
    fix: measurable<critCount ? 'סמן/י בכל קריטריון את תיבת "מדיד", או נסח מחדש כך שיהיה ברור כיצד בודקים אותו במספרים או בעובדות.' : null
  });

  var observable = all.filter(function(x){return x.crit.observable;}).length;
  items.push({
    id:'observable', title:'ניתן לצפות בקריטריונים בזמן אמת',
    status: critCount===0 ? 'info' : (observable===critCount ? 'pass' : (observable===0?'fail':'warn')),
    detail: critCount===0 ? 'טרם הוגדרו קריטריונים.' : (observable+' מתוך '+critCount+' קריטריונים סומנו כברי-צפייה.'),
    fix: observable<critCount ? 'ודא/י שכל קריטריון מתאר התנהגות גלויה שהבוחן יכול לראות בזמן הביצוע, לא תהליך מחשבתי סמוי.' : null
  });

  var tw = totalWeight(st);
  items.push({
    id:'weight_100', title:'המשקל הכולל שווה ל-100%',
    status: critCount===0 ? 'info' : (Math.abs(tw-100)<=0.5 ? 'pass' : 'fail'),
    detail: critCount===0 ? 'טרם הוגדרו קריטריונים למשקל.' : ('סך המשקלים כרגע: '+tw+'%'),
    fix: (critCount>0 && Math.abs(tw-100)>0.5) ? 'עבור/י לשלב 8 (שקלול) ולחצ/י על "נרמל ל-100%" או "חלוקה שווה".' : null
  });

  var hasTask = !!(st.meta.task && st.meta.task.trim());
  var hasRoles = st.roleComponents.length>0;
  items.push({
    id:'task_match', title:'קיימת התאמה בין המשימה לבין הקריטריונים',
    status: (hasTask && hasRoles) ? 'info' : 'warn',
    detail: (hasTask && hasRoles) ? 'קיימים משימה ומרכיבי תפקיד — מומלץ לוודא ידנית שהקריטריונים אכן נגזרים מהמשימה שהוגדרה.' : 'חסרים פרטי משימה (שלב 1) ו/או מרכיבי תפקיד (שלב 5).',
    fix: (!hasTask || !hasRoles) ? 'השלם/י את שלב 1 (פרטי המבחן) ואת שלב 5 (מרכיבי תפקיד).' : 'בדיקה זו דורשת שיקול דעת מקצועי ואינה ניתנת לאוטומציה מלאה.'
  });

  var hasPurpose = !!(st.meta.purpose && st.meta.purpose.trim());
  items.push({
    id:'purpose_only', title:'המבחן בודק את מטרת ההכשרה בלבד',
    status: hasPurpose ? 'info' : 'warn',
    detail: hasPurpose ? 'הוגדרה מטרה למבחן — מומלץ לעבור על רשימת הקריטריונים ולוודא שאף אחד מהם אינו בודק ידע/מיומנות שאינם קשורים למטרה שהוגדרה.' : 'טרם הוגדרה מטרת המבחן בשלב 1.',
    fix: !hasPurpose ? 'חזור/י לשלב 1 והגדר/י מטרה ברורה למבחן.' : 'בדיקה זו דורשת שיקול דעת מקצועי.'
  });

  var scoredAll = all.filter(function(x){return !!x.crit.scoringType;}).length;
  var weightedAll = all.filter(function(x){return (parseFloat(x.crit.weight)||0) > 0;}).length;
  items.push({
    id:'evaluable', title:'אין קריטריונים שאינם ניתנים להערכה',
    status: critCount===0 ? 'info' : ((scoredAll===critCount && weightedAll===critCount) ? 'pass' : 'warn'),
    detail: critCount===0 ? 'טרם הוגדרו קריטריונים.' : (scoredAll+'/'+critCount+' עם שיטת ציינון, '+weightedAll+'/'+critCount+' עם משקל גדול מ-0.'),
    fix: (scoredAll<critCount) ? 'עבור/י לשלב 7 וקבע/י שיטת ציינון לכל קריטריון.' : (weightedAll<critCount ? 'עבור/י לשלב 8 וודא/י שלכל קריטריון משקל גדול מאפס.' : null)
  });

  var exFields = [st.instrExaminee.environment, st.instrExaminee.time, st.instrExaminee.equipment, st.instrExaminee.rules];
  var erFields = [st.instrExaminer.location, st.instrExaminer.intervention, st.instrExaminer.equipment, st.instrExaminer.timing, st.instrExaminer.safety];
  var exFilled = exFields.filter(function(v){return v && v.trim();}).length;
  var erFilled = erFields.filter(function(v){return v && v.trim();}).length;
  items.push({
    id:'instructions', title:'ההוראות לבוחן ולנבחן ברורות וקיימות',
    status: (exFilled===exFields.length && erFilled===erFields.length) ? 'pass' : ((exFilled+erFilled)===0 ? 'fail':'warn'),
    detail: 'הוראות לנבחן: '+exFilled+'/'+exFields.length+' שדות. הוראות לבוחן: '+erFilled+'/'+erFields.length+' שדות.',
    fix: (exFilled<exFields.length || erFilled<erFields.length) ? 'השלם/י את שלבים 10 ו-11.' : null
  });

  var scLen = (st.scenario||'').trim().length;
  var scWords = (st.scenario||'').trim().length ? st.scenario.trim().split(/\s+/).length : 0;
  items.push({
    id:'scenario_real', title:'התרחיש ריאלי ותמציתי',
    status: scLen===0 ? 'fail' : (scWords>120 ? 'warn' : 'pass'),
    detail: scLen===0 ? 'טרם נכתב תרחיש.' : ('התרחיש מכיל כ-'+scWords+' מילים.'),
    fix: scLen===0 ? 'עבור/י לשלב 3 וכתוב/י תרחיש קצר המבוסס על מצב אמת.' : (scWords>120 ? 'התרחיש ארוך יחסית — שקול/י לקצר אותו לכמה שורות בלבד.' : null)
  });

  if(st.complicating.enabled){
    var factors = st.complicating.factors;
    var allFlagged = factors.length>0 && factors.every(function(f){return f.realistic && f.jobRelated && f.executable && f.assessable;});
    items.push({
      id:'factors_ok', title:'הגורמים המסבכים הגיוניים (ריאליים, קשורים לתפקיד, ברי ביצוע וברי הערכה)',
      status: factors.length===0 ? 'warn' : (allFlagged ? 'pass':'warn'),
      detail: factors.length===0 ? 'הופעל שילוב גורמים מסבכים אך טרם נוספו גורמים.' : (factors.filter(function(f){return f.realistic&&f.jobRelated&&f.executable&&f.assessable;}).length+'/'+factors.length+' גורמים עומדים בכל 4 הקריטריונים.'),
      fix: (!allFlagged) ? 'עבור/י לשלב 9 וסמן/י עבור כל גורם מסבך שהוא ריאלי, קשור לתפקיד, בר ביצוע ובר הערכה.' : null
    });
  } else {
    items.push({id:'factors_ok', title:'גורמים מסבכים', status:'info', detail:'לא נבחר לשלב גורמים מסבכים במבחן זה.', fix:null});
  }

  var totalRows = critCount + (st.complicating.enabled ? st.complicating.factors.length : 0);
  items.push({
    id:'sheet_simple', title:'דף התצפית פשוט ומהיר לשימוש',
    status: totalRows===0 ? 'info' : (totalRows<=25 ? 'pass' : (totalRows<=40 ? 'warn':'fail')),
    detail: 'דף התצפית מכיל כרגע '+totalRows+' שורות הערכה.',
    fix: totalRows>25 ? 'שקול/י לצמצם את מספר הקריטריונים לכ-15-25 בלבד, כדי לשמור על דף תצפית פרקטי לשימוש בזמן אמת.' : null
  });

  return items;
}

function readinessScore(items){
  var scoreable = items.filter(function(i){return i.status!=='info';});
  if(scoreable.length===0) return 0;
  var sum = 0;
  scoreable.forEach(function(i){
    if(i.status==='pass') sum+=1;
    else if(i.status==='warn') sum+=0.5;
  });
  return Math.round((sum/scoreable.length)*100);
}

/* ==========================================================================
   RENDER: STEPPER
   ========================================================================== */
function isStepComplete(n, st){
  st = st || state;
  switch(n){
    case 1: return !!(st.meta.role && st.meta.task && st.meta.purpose && st.meta.whatToCheck && st.meta.audience && st.meta.level && st.meta.duration && st.meta.location);
    case 2: return st.perf.cognitive || st.perf.psychomotor || st.perf.emotional;
    case 3: return (st.scenario||'').trim().length>10;
    case 4: return !!(st.script.location && st.script.participants && st.script.time);
    case 5: return st.roleComponents.length>0 && st.roleComponents.every(function(rc){return rc.title && rc.title.trim();});
    case 6: return st.roleComponents.length>0 && st.roleComponents.every(function(rc){return rc.criteria.length>0 && rc.criteria.every(function(c){return c.text && c.text.trim();});});
    case 7: var all=allCriteria(st); return all.length>0 && all.every(function(x){return !!x.crit.scoringType;});
    case 8: return allCriteria(st).length>0 && Math.abs(totalWeight(st)-100)<=0.5;
    case 9: return !st.complicating.enabled || st.complicating.factors.length>0;
    case 10: return !!(st.instrExaminee.environment && st.instrExaminee.time && st.instrExaminee.equipment && st.instrExaminee.rules);
    case 11: return !!(st.instrExaminer.location && st.instrExaminer.intervention && st.instrExaminer.equipment && st.instrExaminer.timing && st.instrExaminer.safety);
  }
  return false;
}
function isStepStarted(n, st){
  st = st || state;
  switch(n){
    case 1: return !!(st.meta.role || st.meta.task || st.meta.purpose || st.meta.whatToCheck || st.meta.audience || st.meta.level || st.meta.duration || st.meta.location);
    case 2: return st.perf.cognitive || st.perf.psychomotor || st.perf.emotional;
    case 3: return (st.scenario||'').trim().length>0;
    case 4: return !!(st.script.location || st.script.participants || st.script.time || st.script.terrain || st.script.equipment);
    case 5: return st.roleComponents.length>0;
    case 6: return allCriteria(st).length>0;
    case 7: return allCriteria(st).some(function(x){return !!x.crit.scoringType;});
    case 9: return st.complicating.enabled;
    case 10: return !!(st.instrExaminee.environment || st.instrExaminee.time || st.instrExaminee.equipment || st.instrExaminee.rules);
    case 11: return !!(st.instrExaminer.location || st.instrExaminer.intervention || st.instrExaminer.equipment || st.instrExaminer.timing || st.instrExaminer.safety);
  }
  return false;
}

function renderStepper(){
  var el = document.getElementById('stepper');
  var html = '';
  STEP_DEFS.forEach(function(s){
    var done = isStepComplete(s.n);
    var started = isStepStarted(s.n);
    var cls = 'stepper-item';
    if(s.n===currentStep) cls += ' active';
    if(done) cls += ' done'; else if(started) cls += ' warn';
    html += '<div class="'+cls+'" data-action="goStep" data-n="'+s.n+'">'+
              '<div class="step-badge">'+(done?'✓':String(s.n).padStart(2,'0'))+'</div>'+
              '<div class="step-label">'+esc(s.label)+'</div>'+
            '</div>';
  });
  el.innerHTML = html;
}
