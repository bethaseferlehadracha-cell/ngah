/* ==========================================================================
   שדות עזר לבניית טפסים
   ========================================================================== */
function fText(label, bind, value, hint, placeholder){
  return '<div class="field-row">'+
    '<label>'+esc(label)+'</label>'+
    '<input type="text" data-bind="'+esc(bind)+'" value="'+esc(value)+'" placeholder="'+esc(placeholder||'')+'">'+
    (hint?'<div class="field-hint">'+esc(hint)+'</div>':'')+
  '</div>';
}
function fArea(label, bind, value, hint, placeholder, rows){
  return '<div class="field-row">'+
    '<label>'+esc(label)+'</label>'+
    '<textarea data-bind="'+esc(bind)+'" placeholder="'+esc(placeholder||'')+'" rows="'+(rows||3)+'">'+esc(value)+'</textarea>'+
    (hint?'<div class="field-hint">'+esc(hint)+'</div>':'')+
  '</div>';
}
function fSelect(label, bind, value, options, hint){
  var opts = options.map(function(o){
    return '<option value="'+esc(o.v)+'" '+(o.v===value?'selected':'')+'>'+esc(o.l)+'</option>';
  }).join('');
  return '<div class="field-row">'+
    '<label>'+esc(label)+'</label>'+
    '<select data-bind="'+esc(bind)+'">'+opts+'</select>'+
    (hint?'<div class="field-hint">'+esc(hint)+'</div>':'')+
  '</div>';
}
function fNumber(label, bind, value, hint, min, max, step){
  return '<div class="field-row">'+
    '<label>'+esc(label)+'</label>'+
    '<input type="number" data-type="number" data-bind="'+esc(bind)+'" value="'+esc(value)+'" '+
      (min!==undefined?'min="'+min+'"':'')+' '+(max!==undefined?'max="'+max+'"':'')+' '+(step!==undefined?'step="'+step+'"':'')+'>'+
    (hint?'<div class="field-hint">'+esc(hint)+'</div>':'')+
  '</div>';
}

function criterionFlagsHtml(rc, c){
  var flags = '';
  var amb = findAmbiguous(c.text);
  if(amb.length){ flags += '<span class="tag tag-warn">⚠ ניסוח עמום: "'+esc(amb[0])+'"</span>'; }
  if(c.text && c.text.trim().length>0 && c.text.trim().split(/\s+/).length>22){ flags += '<span class="tag tag-warn">משפט ארוך — פשט/י את הניסוח</span>'; }
  if(!c.text || !c.text.trim()){ flags += '<span class="tag tag-bad">חסר ניסוח</span>'; }
  return flags;
}

  var dups = findDuplicateCriteria(state);

          '<div class="criterion-flags">'+
            '<label><input type="checkbox" data-bind="roleComponents.'+rc.id+'.criteria.'+c.id+'.observable" '+(c.observable?'checked':'')+'> בר-צפייה</label>'+
            '<label><input type="checkbox" data-bind="roleComponents.'+rc.id+'.criteria.'+c.id+'.measurable" '+(c.measurable?'checked':'')+'> מדיד</label>'+
          '</div>'+
          '<div style="margin-top:6px;">'+criterionFlagsHtml(rc,c)+(dupIds[c.id]?'<span class="tag tag-bad">⚠ דומה לקריטריון אחר</span>':'')+'</div>'+
        '</div>'+
        '<button class="btn btn-outline btn-sm" data-action="removeCriterion" data-rc="'+rc.id+'" data-id="'+c.id+'">🗑</button>'+
      '</div>';
    });

function rerenderStepPanelPreservingFocus(){
  var panel = document.getElementById('stepPanel');
  var active = document.activeElement;
  var bindPath = null, selStart = null, selEnd = null;
  if(active && panel && panel.contains(active) && active.dataset && active.dataset.bind){
    bindPath = active.dataset.bind;
    if(typeof active.selectionStart === 'number'){
      selStart = active.selectionStart; selEnd = active.selectionEnd;
    }
  }
  renderStepPanel();
  if(bindPath){
    var again = panel.querySelector('[data-bind="'+bindPath.replace(/"/g,'\\"')+'"]');
    if(again){
      again.focus();
      if(selStart!=null && again.setSelectionRange){
        try{ again.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

function handleFieldChange(el, isStructural){
  var path = el.dataset.bind;
  var value;
  if(el.type==='checkbox'){ value = el.checked; }
  else if(el.dataset.type==='number'){ value = el.value===''? '' : parseFloat(el.value); }
  else { value = el.value; }
  setByPath(state, path, value);
  scheduleAutosave();

  if(isStructural || el.tagName==='SELECT' || el.type==='checkbox'){
    rerenderStepPanelPreservingFocus();
  } else {
    clearTimeout(window.__typingDebounce);
    window.__typingDebounce = setTimeout(rerenderStepPanelPreservingFocus, 350);
  }
  updateStepperAndStatus();
}

function addFactor(){
  state.complicating.factors.push({id:uid('f'), text:'', realistic:false, jobRelated:false, executable:false, assessable:false, weight:0});
  scheduleAutosave(); renderStepPanel(); updateStepperAndStatus();

function removeFactor(id){
  state.complicating.factors = state.complicating.factors.filter(function(f){return f.id!==id;});
  scheduleAutosave(); renderStepPanel(); updateStepperAndStatus();
}
function equalizeWeights(){
  var all = allCriteria(state);
  var factors = state.complicating.enabled ? state.complicating.factors : [];
  var count = all.length + factors.length;
  if(count===0){ toast('אין קריטריונים לחלוקת משקל'); return; }
  var base = Math.floor((100/count)*10)/10;
  var remainder = Math.round((100 - base*count)*10)/10;
  var i=0;
  all.forEach(function(x){
    x.crit.weight = base;
    i++;
  });
  factors.forEach(function(f){ f.weight = base; i++; });
  /* התאמת שארית לפריט האחרון כדי שהסכום יהיה בדיוק 100 */
  if(factors.length>0){ factors[factors.length-1].weight = Math.round((factors[factors.length-1].weight + remainder)*10)/10; }
  else if(all.length>0){ all[all.length-1].crit.weight = Math.round((all[all.length-1].crit.weight + remainder)*10)/10; }
  scheduleAutosave(); renderStepPanel(); updateStepperAndStatus();
  toast('המשקלים חולקו שווה בשווה');
}
function normalizeWeights(){
  var all = allCriteria(state);
  var factors = state.complicating.enabled ? state.complicating.factors : [];
  var sum = totalWeight(state);
  if(sum<=0){ equalizeWeights(); return; }
  var factor = 100/sum;
  var running = 0;
  var items = [];
  all.forEach(function(x){ items.push(x.crit); });
  factors.forEach(function(f){ items.push(f); });
  items.forEach(function(it, idx){
    if(idx===items.length-1){
      it.weight = Math.round((100-running)*10)/10;
    } else {
      var w = Math.round(((parseFloat(it.weight)||0)*factor)*10)/10;
      it.weight = w;
      running += w;
    }
  });
  scheduleAutosave(); renderStepPanel(); updateStepperAndStatus();
  toast('המשקלים נורמלו ל-100%');
}

/* ==========================================================================
   דף תצפית — תצוגה, חישוב ציון אוטומטי, הדפסה וייצוא לוורד
   ========================================================================== */
function markValue(id){
  var m = state.marks[id];
  return m ? m.value : '';
}
function markNote(id){
  var m = state.marks[id];
  return m ? (m.note||'') : '';
}
function normalizedMark(crit){
  var raw = markValue(crit.id);
  if(raw===''||raw===undefined||raw===null) return null;
  if(crit.scoringType==='dichotomous') return parseFloat(raw);
  if(crit.scoringType==='scale') return parseFloat(raw)/5;
  return parseFloat(raw)/100; /* scored / percent */
}
function computeSheetScore(){
  var rows = [];
  allCriteria(state).forEach(function(x){ rows.push({item:x.crit, weight:parseFloat(x.crit.weight)||0}); });
  if(state.complicating.enabled){
    state.complicating.factors.forEach(function(f){ rows.push({item:f, weight:parseFloat(f.weight)||0, isFactor:true}); });
  }
  var scoreSum = 0, filledCount = 0;
  rows.forEach(function(r){
    var norm = r.isFactor ? (markValue(r.item.id)!=='' ? parseFloat(markValue(r.item.id))/100 : null) : normalizedMark(r.item);
    if(norm!=null){ scoreSum += norm * r.weight; filledCount++; }
  });
  return {score: Math.round(scoreSum*10)/10, filledCount: filledCount, totalRows: rows.length};
}

function markInputHtml(item, isFactor){
  var val = markValue(item.id);
  if(isFactor){
    return '<input type="number" data-type="number" data-mark="'+item.id+'" style="width:70px;" min="0" max="100" value="'+esc(val)+'" placeholder="%">';
  }
  if(item.scoringType==='dichotomous'){
    return '<select data-mark="'+item.id+'">'+
      '<option value="" '+(val===''?'selected':'')+'>—</option>'+
      '<option value="1" '+(val==='1'?'selected':'')+'>בוצע</option>'+
      '<option value="0" '+(val==='0'?'selected':'')+'>לא בוצע</option>'+
    '</select>';
  }
  if(item.scoringType==='scale'){
    return '<select data-mark="'+item.id+'">'+
      '<option value="" '+(val===''?'selected':'')+'>—</option>'+
      [1,2,3,4,5].map(function(n){return '<option value="'+n+'" '+(val===String(n)?'selected':'')+'>'+n+'</option>';}).join('')+
    '</select>';
  }
  return '<input type="number" data-type="number" data-mark="'+item.id+'" style="width:70px;" min="0" max="100" value="'+esc(val)+'" placeholder="%">';
}

function bindSheetEvents(){
  var container = document.getElementById('view-sheet');
  container.addEventListener('input', function(e){
    var t = e.target;
    if(t.dataset.mark){
      state.marks[t.dataset.mark] = state.marks[t.dataset.mark] || {value:'',note:''};
      state.marks[t.dataset.mark].value = t.value;
      scheduleAutosave();
      renderSheetScoreOnly();
    } else if(t.dataset.note){
      state.marks[t.dataset.note] = state.marks[t.dataset.note] || {value:'',note:''};
      state.marks[t.dataset.note].note = t.value;
      scheduleAutosave();
    } else if(t.dataset.bindSheet){
      var val = t.dataset.bindSheet==='passThreshold' ? parseFloat(t.value)||0 : t.value;
      state.sheetMeta[t.dataset.bindSheet] = val;
      scheduleAutosave();
      if(t.dataset.bindSheet==='examName'){
        var disp = document.getElementById('examNameDisplay');
        if(disp) disp.textContent = val || 'ללא שם';
        updateDraftPill();
      } else {
        renderSheetScoreOnly();
      }
    }
  });
  container.addEventListener('change', function(e){
    if(e.target.id==='includeMarksToggle'){
      state.sheetMeta.includeMarksInExport = e.target.checked;
      scheduleAutosave();
    }
  });
}
function renderSheetScoreOnly(){
  /* עדכון קל של תיבות הציון בלבד, מבלי לאבד פוקוס בעמודות הקלט */
  var res = computeSheetScore();
  var pass = res.score >= (parseFloat(state.sheetMeta.passThreshold)||60);
  var boxes = document.querySelectorAll('.sheet-score-box .score-chip');
  if(boxes.length>=4){
    boxes[1].querySelector('.val').textContent = res.filledCount+'/'+res.totalRows;
    boxes[2].querySelector('.val').textContent = res.score+'%';
    boxes[2].className = 'score-chip '+(pass?'pass':'fail');
    boxes[3].querySelector('.val').textContent = pass?'עבר':'לא עבר';
    boxes[3].className = 'score-chip '+(pass?'pass':'fail');
  }
}

function buildExportHtml(){
  var s = state;
  var examName = s.sheetMeta.examName || 'מבחן מעשי';
  var includeMarks = !!s.sheetMeta.includeMarksInExport;

  function row(label, value){
    return '<tr><td style="width:180px;background:#EEEBE0;font-weight:bold;padding:6px 8px;border:1px solid #ccc;">'+esc(label)+'</td>'+
           '<td style="padding:6px 8px;border:1px solid #ccc;">'+esc(value||'—')+'</td></tr>';
  }

  var perfTypes = [];
  if(s.perf.cognitive) perfTypes.push('קוגניטיבי'+(s.perf.breakdown.cognitive?(' — '+s.perf.breakdown.cognitive):''));
  if(s.perf.psychomotor) perfTypes.push('פסיכו-מוטורי'+(s.perf.breakdown.psychomotor?(' — '+s.perf.breakdown.psychomotor):''));
  if(s.perf.emotional) perfTypes.push('רגשי'+(s.perf.breakdown.emotional?(' — '+s.perf.breakdown.emotional):''));

  var html = ''+
  '<h1 style="text-align:center;color:#4A5941;">מבחן מעשי — '+esc(examName)+'</h1>'+
  '<p style="text-align:center;color:#666;font-size:12px;">הופק ע"י בונה מבחן מעשי · בית הספר להדרכה · '+todayStr()+'</p>'+
  '<h2 style="color:#5E6E52;border-bottom:2px solid #7E8F6E;padding-bottom:4px;">1. פרטי המבחן</h2>'+
  '<table style="width:100%;border-collapse:collapse;margin-bottom:16px;">'+
    row('תפקיד נבחן', s.meta.role)+row('משימה', s.meta.task)+row('מטרת המבחן', s.meta.purpose)+
    row('מה בודקים', s.meta.whatToCheck)+row('קהל יעד', s.meta.audience)+row('רמת נבחנים', s.meta.level)+
    row('משך המבחן', s.meta.duration)+row('מיקום', s.meta.location)+row('סוג', s.meta.mode==='group'?'קבוצתי':'אישי')+
    row('סוגי ביצוע נבחנים', perfTypes.join('; '))+
  '</table>'+

  '<h2 style="color:#5E6E52;border-bottom:2px solid #7E8F6E;padding-bottom:4px;">2. תרחיש</h2>'+
  '<p style="white-space:pre-wrap;">'+esc(s.scenario||'—')+'</p>'+

  '<h2 style="color:#5E6E52;border-bottom:2px solid #7E8F6E;padding-bottom:4px;">3. תסריט</h2>'+
  '<table style="width:100%;border-collapse:collapse;margin-bottom:16px;">'+
    row('מיקום הבחינה', s.script.location)+row('מתאר השטח', s.script.terrain)+row('משתתפים', s.script.participants)+
    row('ציוד ואמצעים', s.script.equipment)+row('משאבים', s.script.resources)+row('מסגרת זמנים', s.script.time)+
    row('סדר האירועים', s.script.order)+
  '</table>'+

  '<h2 style="color:#5E6E52;border-bottom:2px solid #7E8F6E;padding-bottom:4px;">4. הוראות לנבחן</h2>'+
  '<table style="width:100%;border-collapse:collapse;margin-bottom:16px;">'+
    row('סביבה', s.instrExaminee.environment)+row('זמנים', s.instrExaminee.time)+
    row('אמצעים', s.instrExaminee.equipment)+row('כללים', s.instrExaminee.rules)+
  '</table>'+

  '<h2 style="color:#5E6E52;border-bottom:2px solid #7E8F6E;padding-bottom:4px;">5. הוראות לבוחן</h2>'+
  '<table style="width:100%;border-collapse:collapse;margin-bottom:16px;">'+
    row('מיקום הבוחן', s.instrExaminer.location)+row('נקודות התערבות', s.instrExaminer.intervention)+
    row('אמצעים', s.instrExaminer.equipment)+row('זמנים', s.instrExaminer.timing)+row('כללי בטיחות', s.instrExaminer.safety)+
    row('דף תצפית', 'מצורף בעמוד הבא — יש להשתמש בו לאורך המבחן')+
  '</table>'+

  '<div style="page-break-before:always;"></div>'+
  '<h2 style="color:#5E6E52;border-bottom:2px solid #7E8F6E;padding-bottom:4px;">6. דף תצפית</h2>'+
  '<table style="width:100%;border-collapse:collapse;margin-bottom:8px;font-size:12px;">'+
    row('שם המבחן', examName)+row('תאריך', todayStr())+
    row(s.sheetMeta.examineeLabel, '______________________')+row(s.sheetMeta.examinerLabel, '______________________')+
  '</table>'+

  '<table style="width:100%;border-collapse:collapse;font-size:11.5px;">'+
    '<tr style="background:#E4E9DC;"><th style="border:1px solid #ccc;padding:6px;">קריטריון</th><th style="border:1px solid #ccc;padding:6px;">שיטת ציינון</th><th style="border:1px solid #ccc;padding:6px;">משקל</th><th style="border:1px solid #ccc;padding:6px;">ביצוע</th><th style="border:1px solid #ccc;padding:6px;">הערות</th></tr>';

  s.roleComponents.forEach(function(rc){
    if(rc.criteria.length===0) return;
    html += '<tr><td colspan="5" style="background:#E2E9EC;font-weight:bold;border:1px solid #ccc;padding:6px;">'+esc(rc.title||'מרכיב תפקיד')+'</td></tr>';
    rc.criteria.forEach(function(c){
      var markCell = '&nbsp;&nbsp;&nbsp;&nbsp;☐&nbsp;&nbsp;&nbsp;&nbsp;';
      if(includeMarks){
        var v = markValue(c.id);
        markCell = esc(v===''||v===undefined?'—':(c.scoringType==='dichotomous'? (v==='1'?'בוצע':'לא בוצע') : v));
      }
      html += '<tr>'+
        '<td style="border:1px solid #ccc;padding:6px;">'+esc(c.text||'—')+'</td>'+
        '<td style="border:1px solid #ccc;padding:6px;">'+esc(SCORING_LABELS[c.scoringType]||'—')+'</td>'+
        '<td style="border:1px solid #ccc;padding:6px;text-align:center;">'+esc(c.weight||0)+'%</td>'+
        '<td style="border:1px solid #ccc;padding:6px;text-align:center;">'+markCell+'</td>'+
        '<td style="border:1px solid #ccc;padding:6px;">'+(includeMarks?esc(markNote(c.id)):'&nbsp;')+'</td>'+
      '</tr>';
    });
  });
  if(s.complicating.enabled && s.complicating.factors.length>0){
    html += '<tr><td colspan="5" style="background:#F3E7D2;font-weight:bold;border:1px solid #ccc;padding:6px;">גורמים מסבכים</td></tr>';
    s.complicating.factors.forEach(function(f){
      var markCell = '&nbsp;&nbsp;&nbsp;&nbsp;____%&nbsp;&nbsp;&nbsp;&nbsp;';
      if(includeMarks){ var v=markValue(f.id); markCell = esc(v===''||v===undefined?'—':v+'%'); }
      html += '<tr>'+
        '<td style="border:1px solid #ccc;padding:6px;">'+esc(f.text||'—')+'</td>'+
        '<td style="border:1px solid #ccc;padding:6px;">אחוזים</td>'+
        '<td style="border:1px solid #ccc;padding:6px;text-align:center;">'+esc(f.weight||0)+'%</td>'+
        '<td style="border:1px solid #ccc;padding:6px;text-align:center;">'+markCell+'</td>'+
        '<td style="border:1px solid #ccc;padding:6px;">'+(includeMarks?esc(markNote(f.id)):'&nbsp;')+'</td>'+
      '</tr>';
    });
  }
  html += '</table>';

  if(includeMarks){
    var res = computeSheetScore();
    var pass = res.score >= (parseFloat(s.sheetMeta.passThreshold)||60);
    html += '<p style="margin-top:14px;font-weight:bold;">ציון סופי: '+res.score+'% &nbsp;&nbsp; תוצאה: '+(pass?'עבר':'לא עבר')+' (סף מעבר: '+(s.sheetMeta.passThreshold||60)+'%)</p>';
  } else {
    html += '<table style="width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;">'+
      row('חישוב ציון', '____________')+row('אחוז הצלחה', '____________')+row('ציון סופי', '____________')+row('תוצאה', '☐ עבר      ☐ לא עבר')+
    '</table>';
  }

  if(s.professionalNotes && (s.professionalNotes.emphases || s.professionalNotes.commonMistakes || s.professionalNotes.comprehensionNotes)){
    html += '<div style="page-break-before:always;"></div>';
    html += '<h2 style="color:#5E6E52;border-bottom:2px solid #7E8F6E;padding-bottom:4px;">7. דגשים מקצועיים וטעויות נפוצות (מתיק המדריך)</h2>';
    if(s.professionalNotes.emphases){
      html += '<h3 style="color:#5E6E52;">דגשים מקצועיים ונקודות עיקריות</h3><p style="white-space:pre-wrap;">'+esc(s.professionalNotes.emphases)+'</p>';
    }
    if(s.professionalNotes.commonMistakes){
      html += '<h3 style="color:#5E6E52;">טעויות נפוצות</h3><p style="white-space:pre-wrap;">'+esc(s.professionalNotes.commonMistakes)+'</p>';
    }
    if(s.professionalNotes.comprehensionNotes){
      html += '<h3 style="color:#5E6E52;">בדיקות הבנה (רקע מתיק המדריך)</h3><p style="white-space:pre-wrap;">'+esc(s.professionalNotes.comprehensionNotes)+'</p>';
    }
  }

  return html;
}

function exportWord(){
  var examName = state.sheetMeta.examName || 'מבחן_מעשי';
  var bodyHtml = buildExportHtml();
  var fullHtml = ''+
  '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'+
  '<head><meta charset="utf-8">'+
  '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->'+
  '<style>body{font-family:Arial, "Segoe UI", sans-serif; direction:rtl;} table{direction:rtl;} h1,h2{font-family:Arial,sans-serif;}</style>'+
  '</head><body dir="rtl">'+bodyHtml+'</body></html>';

  var blob = new Blob(['\ufeff', fullHtml], {type:'application/msword;charset=utf-8'});
  var link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = examName.replace(/[\\/:*?"<>|]/g,'_')+'.doc';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  toast('קובץ הוורד יורד...');
}

var STATUS_LABEL = {pass:'תקין', warn:'אזהרה', fail:'לא תקין', info:'למידע'};
function renderValidationView(){
  var el = document.getElementById('validationContent');
  var items = computeChecklist(state);
  var score = readinessScore(items);
  var passN = items.filter(function(i){return i.status==='pass';}).length;
  var warnN = items.filter(function(i){return i.status==='warn';}).length;
  var failN = items.filter(function(i){return i.status==='fail';}).length;

  var html = '<h2 style="margin-bottom:4px;">🛡 דוח בדיקת תקינות (מנוע כללים)</h2>'+
  '<p class="step-desc">בדיקה אוטומטית מבוססת-כללים לפי עקרונות התוקף, המהימנות והפרקטיות מתיק המדריך — ללא שימוש בבינה מלאכותית.</p>';

  html += '<div class="validation-summary">'+
    '<div class="vsum-card"><div class="num">'+score+'%</div><div class="lab">ציון מוכנות כולל</div></div>'+
    '<div class="vsum-card pass"><div class="num">'+passN+'</div><div class="lab">כללים תקינים</div></div>'+
    '<div class="vsum-card warn"><div class="num">'+warnN+'</div><div class="lab">אזהרות</div></div>'+
    '<div class="vsum-card fail"><div class="num">'+failN+'</div><div class="lab">כשלים</div></div>'+
  '</div>';

  items.forEach(function(it){
    html += '<div class="rule-detail-card">'+
      '<div class="led-big rule-led '+it.status+'"></div>'+
      '<div style="flex:1;">'+
        '<h4>'+esc(it.title)+' <span class="tag '+(it.status==='pass'?'tag-ok':(it.status==='fail'?'tag-bad':'tag-warn'))+'" style="margin-inline-start:8px;">'+STATUS_LABEL[it.status]+'</span></h4>'+
        '<p>'+esc(it.detail)+'</p>'+
        (it.fix ? '<div class="rule-fix">💡 איך לתקן: '+esc(it.fix)+'</div>' : '')+
      '</div>'+
    '</div>';
  });
  el.innerHTML = html;
}

/* ==========================================================================
   ניהול טיוטות
   ========================================================================== */
function updateDraftPill(){
  var textEl = document.getElementById('draftPillText');
  var dot = document.getElementById('draftDot');
  if(!textEl) return;
  var name = currentDraftName || (state.sheetMeta.examName ? state.sheetMeta.examName : 'טיוטה חדשה');
  textEl.textContent = name + (isDirty ? ' — שינויים לא שמורים' : ' — נשמר');
  dot.className = 'dot'+(isDirty ? '' : ' saved');
}

function promptSaveDraft(){
  var suggested = currentDraftName || state.sheetMeta.examName || ('מבחן '+todayStr());
  var name = prompt('שם לשמירת הטיוטה:', suggested);
  if(!name) return;
  saveDraft(name);
}
function saveDraft(name){
  var all = getAllDrafts();
  all[name] = {state: state, extracted: extracted, savedAt: Date.now()};
  var ok = persistAllDrafts(all);
  if(ok){
    currentDraftName = name;
    isDirty = false;
    updateDraftPill();
    toast('הטיוטה "'+name+'" נשמרה בהצלחה');
    if(currentView==='drafts') renderDraftsView();
  } else {
    toast('שגיאה: לא ניתן לשמור (אחסון מקומי אינו זמין)');
  }
}
function loadDraft(name){
  var all = getAllDrafts();
  var d = all[name];
  if(!d) return;
  if(isDirty && !confirm('קיימים שינויים לא שמורים בטיוטה הנוכחית. לטעון טיוטה אחרת בכל זאת?')) return;
  state = d.state;
  extracted = d.extracted || null;
  /* השלמת שדות שעלולים לחסור בטיוטות ישנות */
  if(!state.marks) state.marks = {};
  if(!state.sheetMeta) state.sheetMeta = freshState().sheetMeta;
  currentDraftName = name;
  currentStep = 1;
  isDirty = false;
  renderAll();
  switchView(extracted ? 'wizard' : 'upload');
  toast('הטיוטה "'+name+'" נטענה');
}
function deleteDraft(name){
  if(!confirm('למחוק לצמיתות את הטיוטה "'+name+'"?')) return;
  var all = getAllDrafts();
  delete all[name];
  persistAllDrafts(all);
  if(currentDraftName===name) currentDraftName = null;
  renderDraftsView();
  toast('הטיוטה נמחקה');
}
function newDraft(){
  if(isDirty && !confirm('קיימים שינויים לא שמורים. להתחיל מבחן חדש בכל זאת?')) return;
  state = freshState();
  extracted = null;
  currentDraftName = null;
  currentStep = 1;
  isDirty = false;
  renderAll();
  renderUploadView();
  switchView('upload');
  toast('נפתחה טיוטה חדשה — העלה/י תיק מדריך כדי להתחיל');
}

function renderDraftsView(){
  var el = document.getElementById('draftsContent');
  var all = getAllDrafts();
  var names = Object.keys(all).sort(function(a,b){return (all[b].savedAt||0)-(all[a].savedAt||0);});

  var html = '<h2>💾 טיוטות שמורות</h2><p class="step-desc">שמירה וטעינה מקומיות בדפדפן בלבד — ללא שרת וללא ענן. הטיוטות נשמרות רק במחשב ובדפדפן הנוכחיים.</p>';

  if(!STORAGE_AVAILABLE){
    html += '<div class="storage-warning">⚠ האחסון המקומי אינו זמין בדפדפן זה (ייתכן מצב גלישה פרטית). לא ניתן לשמור טיוטות.</div>';
  }

  html += '<div class="drafts-grid">';
  html += '<div class="draft-card"><h3>הטיוטה הנוכחית</h3>'+
    '<p style="font-size:13px;color:var(--ink-soft);">'+(currentDraftName? ('שם: '+esc(currentDraftName)) : 'טיוטה חדשה, טרם נשמרה בשם.')+'</p>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;">'+
      '<button class="btn btn-primary btn-sm" data-action="promptSaveDraft">💾 שמור בשם...</button>'+
      '<button class="btn btn-outline btn-sm" data-action="newDraft">＋ טיוטה חדשה</button>'+
    '</div></div>';

  html += '<div class="draft-card"><h3>טיוטות שמורות ('+names.length+')</h3>';
  if(names.length===0){
    html += '<p style="font-size:13px;color:var(--ink-faint);">אין עדיין טיוטות שמורות.</p>';
  } else {
    names.forEach(function(name){
      var d = all[name];
      var date = d.savedAt ? new Date(d.savedAt).toLocaleString('he-IL') : '—';
      html += '<div class="draft-list-item">'+
        '<div><div class="name">'+esc(name)+'</div><div class="meta">נשמר: '+date+'</div></div>'+
        '<div style="display:flex;gap:6px;">'+
          '<button class="btn btn-secondary btn-sm" data-action="loadDraft" data-name="'+esc(name)+'">טען</button>'+
          '<button class="btn btn-danger btn-sm" data-action="deleteDraft" data-name="'+esc(name)+'">מחק</button>'+
        '</div>'+
      '</div>';
    });
  }
  html += '</div></div>';
  el.innerHTML = html;
}

   רינדור כולל + אתחול + האזנה לאירועים גלובלית

function renderAll(){
  renderStepper();
  renderStepPanel();
  renderLiveStatus();
  updateDraftPill();
}

var ACTIONS = {
  goStep: function(ds){ goStep(ds.n); },
  prevStep: function(){ prevStep(); },
  nextStep: function(){ nextStep(); },
  switchView: function(ds){ switchView(ds.view); },
  addRoleComponent: function(){ addRoleComponent(); },
  removeRoleComponent: function(ds){ removeRoleComponent(ds.id); },
  addCriterion: function(ds){ addCriterion(ds.rc); },
  removeCriterion: function(ds){ removeCriterion(ds.rc, ds.id); },
  addFactor: function(){ addFactor(); },
  removeFactor: function(ds){ removeFactor(ds.id); },
  equalizeWeights: function(){ equalizeWeights(); },
  normalizeWeights: function(){ normalizeWeights(); },
  promptSaveDraft: function(){ promptSaveDraft(); },
  newDraft: function(){ newDraft(); },
  loadDraft: function(ds){ loadDraft(ds.name); },
  deleteDraft: function(ds){ deleteDraft(ds.name); },
  printSheet: function(){ printSheet(); },
  exportWord: function(){ exportWord(); },
  resetMarks: function(){ resetMarks(); },
  toggleAccordion: function(ds){
    var el = document.getElementById('acc_'+ds.cat);
    if(!el) return;
    el.classList.toggle('open');
    accordionOpen[ds.cat] = el.classList.contains('open');
  },
  selectAllCategory: function(ds){ selectAllCategory(ds.cat); },
  clearAllCategory: function(ds){ clearAllCategory(ds.cat); },
  addManualCandidate: function(ds){ addManualCandidate(ds.cat); },
  editCandidate: function(ds){ toggleEditCandidate(ds.cat, ds.id); },
  deleteCandidate: function(ds){ deleteCandidateItem(ds.cat, ds.id); },
  compileAndBuild: function(){ compileAndBuild(); }
};

function initGlobalEvents(){
  document.body.addEventListener('click', function(e){
    var btn = e.target.closest('[data-action]');
    if(!btn) return;
    var action = ACTIONS[btn.dataset.action];
    if(action) action(btn.dataset);
  });

  /* שדות האשף (data-bind) — מוגבל למכל האשף בלבד */
  var wizardView = document.getElementById('view-wizard');
  wizardView.addEventListener('input', function(e){
    var el = e.target.closest('[data-bind]');
    if(!el || el.tagName==='SELECT') return;
    handleFieldChange(el, false);
  });
  wizardView.addEventListener('change', function(e){
    var el = e.target.closest('[data-bind]');
    if(!el) return;
    handleFieldChange(el, true);
  });

  document.getElementById('btnQuickSave').addEventListener('click', promptSaveDraft);

  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ switchView(btn.dataset.view); });
  });

  bindSheetEvents();
  bindUploadEvents();
  bindSelectionEvents();

  window.addEventListener('beforeunload', function(e){
    if(isDirty){
      e.preventDefault();
      e.returnValue = '';
    }
  });
}

function tryRestoreAutosave(){
  var raw = safeGet(STORAGE_KEY_AUTOSAVE);
  if(!raw) return;
  try{
    var data = JSON.parse(raw);
    if(!data || !data.state) return;
    var hasContent = data.state.meta && (data.state.meta.role || data.state.meta.task || (data.state.roleComponents||[]).length>0);
    if(!hasContent) return;
    if(confirm('נמצאה טיוטה אוטומטית שלא נשמרה מפעם קודמת. לטעון אותה?')){
      state = data.state;
      extracted = data.extracted || null;
      if(!state.marks) state.marks = {};
      if(!state.sheetMeta) state.sheetMeta = freshState().sheetMeta;
      currentDraftName = data.draftName || null;
      isDirty = false;
    } else {
      safeRemove(STORAGE_KEY_AUTOSAVE);
    }
  }catch(e){ /* ignore corrupt autosave */ }
}

document.addEventListener('DOMContentLoaded', function(){
  tryRestoreAutosave();
  initGlobalEvents();
  renderAll();
  renderUploadView();
  if(extracted){ switchView('selection'); } else { switchView('upload'); }
});

var uploadState = 'idle'; /* idle | analyzing | done | error */
var uploadError = '';
var uploadedFileMeta = null;

function renderUploadView(){
  var el = document.getElementById('uploadContent');
  if(!el) return;

function handleFile(file){
  if(!file) return;
  var ext = (file.name.split('.').pop()||'').toLowerCase();
  if(ext!=='docx' && ext!=='pdf' && ext!=='doc'){
    uploadState='error'; uploadError='ניתן להעלות קובץ Word (.docx) או PDF בלבד.'; renderUploadView(); return;
  }
  uploadedFileMeta = {name:file.name};
  uploadState = 'analyzing';
  renderUploadView();
  var reader = new FileReader();
  reader.onload = function(e){
    setTimeout(function(){
      try{
        var buf = e.target.result;
        var result;
        try{
          result = (ext==='pdf') ? analyzePdfArrayBuffer(buf) : analyzeDocxArrayBuffer(buf);
        }catch(primaryErr){
          try{ result = (ext==='pdf') ? analyzeDocxArrayBuffer(buf) : analyzePdfArrayBuffer(buf); }
          catch(secondaryErr){ throw primaryErr; }
        }
        extracted = result;
        accordionOpen = {};
        uploadState = 'done';
        renderUploadView();
        toast('הניתוח הושלם — נמצאו '+result.blockCount+' יחידות תוכן במסמך');
        scheduleAutosave();
      }catch(err){
        uploadState = 'error';
        uploadError = (err && err.message) ? err.message : 'שגיאה לא צפויה בניתוח הקובץ.';
        renderUploadView();
      }
    }, 30);
  };
  reader.onerror = function(){
    uploadState = 'error';
    uploadError = 'שגיאה בקריאת הקובץ מהדיסק.';
    renderUploadView();
  };
  reader.readAsArrayBuffer(file);
}

  var tmp = document.createElement('div');
  tmp.innerHTML = renderAccordionSection(catKey);
  elx.replaceWith(tmp.firstElementChild);

function toggleEditCandidate(cat, id){
  var item = findCandidateItem(cat, id);
  if(!item) return;
  var displayDiv = document.querySelector('[data-display-id="'+id+'"]');
  if(!displayDiv || displayDiv.tagName==='TEXTAREA') return;
  var ta = document.createElement('textarea');
  ta.value = item.text;
  ta.setAttribute('data-display-id', id);
  displayDiv.replaceWith(ta);
  ta.focus();
  ta.addEventListener('blur', function commit(){
    item.text = ta.value.trim();
    item.edited = true;
    scheduleAutosave();
    var newDiv = document.createElement('div');
    newDiv.className = 'cand-display';
    newDiv.setAttribute('data-display-id', id);
    newDiv.textContent = item.text;
    ta.replaceWith(newDiv);
  }, {once:true});
}

function addManualCandidate(cat){
  var ta = document.querySelector('[data-manual-cat="'+cat+'"]');
  if(!ta) return;
  var text = ta.value.trim();
  if(!text) return;
  extracted.categories[cat].push({id:newCandId(), text:text, source:'הוספה ידנית', selected:true, edited:true});
  scheduleAutosave();
  accordionOpen[cat] = true;
  rerenderAccordionSection(cat);
  toast('נוסף בהצלחה');
}
function deleteCandidateItem(cat, id){

function clearAllCategory(cat){

/* ==========================================================================
   קומפילציה: מהבחירות שסומנו -> אובייקט המבחן (state) לשימוש בשלבי העריכה/דף התצפית
   ========================================================================== */
function joinSelectedTexts(items, sep){
  if(!items) return '';
  return items.filter(function(i){return i.selected;}).map(function(i){return i.text;}).join(sep||'\n');
}
function normalizeForMatch(s){
  return (s||'').replace(/[^\u0590-\u05FF a-zA-Z0-9]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
}
var SCRIPT_FIELD_PATTERNS = [
  {re:/^מיקום\s*(הבחינה|המבחן)?\s*[:\-–]?\s*/, field:'location'},
  {re:/^מתאר\s*השטח\s*[:\-–]?\s*/, field:'terrain'},
  {re:/^(זהות\s*האנשים\s*המעורבים|משתתפים)\s*[:\-–]?\s*/, field:'participants'},
  {re:/^(ציוד|אמצעים)[^:\-–]{0,20}[:\-–]\s*/, field:'equipment'},
  {re:/^(תקציב|משאבים)[^:\-–]{0,20}[:\-–]?\s*/, field:'resources'},
  {re:/^(מסגרת\s*זמנים|זמנים|זמן\s*ביצוע)\s*[:\-–]?\s*/, field:'time'}
];
var EXAMINEE_FIELD_PATTERNS = [
  {re:/^סביבה\s*[:\-–]?\s*/, field:'environment'},
  {re:/^זמנים?\s*[:\-–]?\s*/, field:'time'},
  {re:/^(אמצעים|ציוד)[^:\-–]{0,25}[:\-–]\s*/, field:'equipment'},
  {re:/^כללים\s*[:\-–]?\s*/, field:'rules'}
];
var EXAMINER_FIELD_PATTERNS = [
  {re:/^מיקום\s*הבוחן\s*[:\-–]?\s*/, field:'location'},
  {re:/^נקודות\s*התערבות\s*[:\-–]?\s*/, field:'intervention'},
  {re:/^(אמצעים|ציוד)[^:\-–]{0,25}[:\-–]\s*/, field:'equipment'},
  {re:/^זמנים?\s*[:\-–]?\s*/, field:'timing'},
  {re:/^(בטיחות|כללי\s*בטיחות)[^:\-–]{0,20}[:\-–]?\s*/, field:'safety'}
];
function distributeToFields(items, patterns, target, fallbackField){
  if(!items) return;
  items.filter(function(i){return i.selected;}).forEach(function(it){
    var text = (it.text||'').trim();
    if(!text) return;
    var matched = false;
    for(var i=0;i<patterns.length;i++){
      if(patterns[i].re.test(text)){
        var val = text.replace(patterns[i].re,'').trim() || text;
        target[patterns[i].field] = target[patterns[i].field] ? (target[patterns[i].field]+'; '+val) : val;
        matched = true;
        break;
      }
    }
    if(!matched && fallbackField){
      target[fallbackField] = target[fallbackField] ? (target[fallbackField]+'\n'+text) : text;
    }
  });
}

function compileToBuild(){
  var st = freshState();
  var cats = extracted.categories;
  var meta = extracted.meta || {};

  st.meta.role = meta.courseTitle || '';
  var taskLines = joinSelectedTexts(cats.tasks,'\n').split('\n').filter(Boolean);
  st.meta.task = taskLines.slice(0,4).join('; ');
  st.meta.purpose = joinSelectedTexts(cats.goals,' ');
  st.meta.whatToCheck = joinSelectedTexts(cats.stages,' ');
  st.meta.duration = (meta.durationCandidates && meta.durationCandidates[0]) ||
    (extracted.totalLessonMinutes ? (extracted.totalLessonMinutes+' דקות') : '');
  st.sheetMeta.examName = meta.lessonTopic || meta.courseTitle || '';

  st.scenario = joinSelectedTexts(cats.scenario,'\n');

  distributeToFields(cats.script, SCRIPT_FIELD_PATTERNS, st.script, 'order');
  distributeToFields(cats.performanceConditions, SCRIPT_FIELD_PATTERNS, st.script, 'order');
  distributeToFields(cats.startConditions, SCRIPT_FIELD_PATTERNS, st.script, 'order');
  distributeToFields(cats.equipment, SCRIPT_FIELD_PATTERNS, st.script, 'equipment');
  var seqSelected = (cats.lessonSequence||[]).filter(function(i){return i.selected;});
  if(seqSelected.length){
    var seqText = seqSelected.map(function(i){return i.text;}).join('\n');
    st.script.order = st.script.order ? (st.script.order+'\n'+seqText) : seqText;
  }

  distributeToFields(cats.examineeInstructions, EXAMINEE_FIELD_PATTERNS, st.instrExaminee, 'rules');
  distributeToFields(cats.examinerInstructions, EXAMINER_FIELD_PATTERNS, st.instrExaminer, 'safety');
  var eqParts = [];
  if(cats.equipment) eqParts.push(joinSelectedTexts(cats.equipment,'; '));
  if(cats.teachingAids) eqParts.push(joinSelectedTexts(cats.teachingAids,'; '));
  var eqText = eqParts.filter(Boolean).join('; ');
  if(eqText){
    st.instrExaminee.equipment = st.instrExaminee.equipment ? (st.instrExaminee.equipment+'; '+eqText) : eqText;
    st.instrExaminer.equipment = st.instrExaminer.equipment ? (st.instrExaminer.equipment+'; '+eqText) : eqText;
  }

  /* מרכיבי תפקיד וקריטריונים: מהחלק המפורש בתיק (אם קיים), ובנוסף מנושאי/פעולות מערך השיעור שסומנו */
  var selectedRC = (cats.roleComponents||[]).filter(function(i){return i.selected;});
  var selectedCrit = (cats.criteria||[]).filter(function(i){return i.selected;});
  var selectedTopics = (cats.lessonTopics||[]).filter(function(i){return i.selected;});
  var selectedActions = (cats.instructorActions||[]).filter(function(i){return i.selected;});

  var rcByNorm = {};
  selectedRC.forEach(function(rc){
    var obj = {id:uid('rc'), title:rc.text, rationale:'', criteria:[]};
    st.roleComponents.push(obj);
    rcByNorm[normalizeForMatch(rc.text)] = obj;
  });
  selectedTopics.forEach(function(topic){
    var norm = normalizeForMatch(topic.text);
    if(rcByNorm[norm]) return; /* כבר קיים כמרכיב תפקיד מפורש */
    var obj = {id:uid('rc'), title:topic.text, rationale:'מתוך מערך השיעור', criteria:[]};
    st.roleComponents.push(obj);
    rcByNorm[norm] = obj;
  });

  var fallbackGroups = {};
  function placeUnderFallback(groupKey, criterionObj){
    if(!fallbackGroups[groupKey]){
      var obj2 = {id:uid('rc'), title:groupKey, rationale:'', criteria:[]};
      st.roleComponents.push(obj2);
      fallbackGroups[groupKey] = obj2;
    }
    fallbackGroups[groupKey].criteria.push(criterionObj);
  }

  selectedCrit.forEach(function(c){
    var target = null;
    if(c.parentGuess){
      var norm = normalizeForMatch(c.parentGuess);
      if(norm.length>1){
        Object.keys(rcByNorm).forEach(function(k){
          if(!target && k.length>1 && (k.indexOf(norm)!==-1 || norm.indexOf(k)!==-1)){ target = rcByNorm[k]; }
        });
      }
    }
    var critObj = {id:uid('c'), text:c.text, observable:false, measurable:false,
      scoringType: recommendScoringType(c.text), weight:0, maxScore:10, notes:''};
    if(target) target.criteria.push(critObj);
    else placeUnderFallback(c.parentGuess || 'מרכיב כללי', critObj);
  });

  selectedActions.forEach(function(a){
    var target = null;
    if(a.ieud){
      var norm = normalizeForMatch(a.ieud);
      if(norm.length>1){
        Object.keys(rcByNorm).forEach(function(k){
          if(!target && k.length>1 && (k.indexOf(norm)!==-1 || norm.indexOf(k)!==-1)){ target = rcByNorm[k]; }
        });
      }
    }
    var critObj = {id:uid('c'), text:a.text, observable:false, measurable:false,
      scoringType: recommendScoringType(a.text), weight:0, maxScore:10, notes:'פעולת מדריך ממערך השיעור'};
    if(target) target.criteria.push(critObj);
    else placeUnderFallback(a.ieud || a.stage || 'פעולות מדריך כלליות', critObj);
  });

  /* קריטריונים מוצעים שנגזרו ממטרות/פעולות ואושרו ע"י המשתמש */
  var selectedDerived = (cats.derivedCriteria||[]).filter(function(i){return i.selected;});
  selectedDerived.forEach(function(d){
    var critObj = {id:uid('c'), text:d.text, observable:false, measurable:false,
      scoringType: recommendScoringType(d.text), weight:0, maxScore:10, notes:(d.origin||'נגזר מהתיק')};
    placeUnderFallback('קריטריונים שנגזרו מהתיק', critObj);
  });
  /* הסרת מרכיבי תפקיד שנוצרו כברירת מחדל אך נותרו ללא אף קריטריון */
  st.roleComponents = st.roleComponents.filter(function(rc, idx){
    return rc.criteria.length>0 || selectedRC.some(function(x){return normalizeForMatch(x.text)===normalizeForMatch(rc.title);});
  });

  var emphasesParts = [joinSelectedTexts(cats.emphases,'\n'), joinSelectedTexts(cats.keyPoints,'\n')].filter(Boolean);
  st.professionalNotes = {
    emphases: emphasesParts.join('\n'),
    commonMistakes: joinSelectedTexts(cats.commonMistakes,'\n'),
    comprehensionNotes: joinSelectedTexts(cats.comprehensionChecks,'\n')
  };

  state = st;
  if(allCriteria(state).length>0) equalizeWeights();
}

function compileAndBuild(){
  if(!extracted){ toast('יש להעלות ולנתח תיק מדריך תחילה'); return; }
  var hasExisting = state.roleComponents && state.roleComponents.length>0;
  if(hasExisting && !confirm('כבר קיים מבנה מבחן שנבנה קודם מהבחירות. לבנות מחדש? כל עריכה ידנית שבוצעה במסך "עריכה ואישוש" תוחלף בנתונים המעודכנים.')) return;
  compileToBuild();
  currentStep = 1;
  renderAll();
  switchView('wizard');
  toast('המבחן נבנה מהבחירות שסימנת — ניתן לעדכן ולהשלים בכל שלב');
}

/* ==========================================================================
   קישור אירועים: העלאה (dropzone) ובחירת תוכן (סימון/חיפוש/סינון)
   ========================================================================== */
function bindUploadEvents(){
  var container = document.getElementById('view-upload');
  container.addEventListener('click', function(e){
    if(e.target.closest('#dropzone')){
      var input = document.getElementById('fileInput');
      if(input) input.click();
    }
  });
  container.addEventListener('change', function(e){
    if(e.target.id==='fileInput'){
      var f = e.target.files && e.target.files[0];
      if(f) handleFile(f);
    }
  });
  container.addEventListener('dragover', function(e){
    if(e.target.closest('#dropzone')){ e.preventDefault(); var dz=document.getElementById('dropzone'); if(dz) dz.classList.add('dragover'); }
  });
  container.addEventListener('dragleave', function(e){
    if(e.target.closest('#dropzone')){ var dz=document.getElementById('dropzone'); if(dz) dz.classList.remove('dragover'); }
  });
  container.addEventListener('drop', function(e){
    if(e.target.closest('#dropzone')){
      e.preventDefault();
      var dz=document.getElementById('dropzone'); if(dz) dz.classList.remove('dragover');
      var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if(f) handleFile(f);
    }
  });
}

function bindSelectionEvents(){
  var container = document.getElementById('view-selection');
  container.addEventListener('change', function(e){
    var t = e.target;
    if(t.dataset.candToggle){
      toggleCandidateSelected(t.dataset.cat, t.dataset.id, t.checked);
    } else if(t.dataset.filterCat){
      applyRowFilter(t.dataset.filterCat);
    }
  });
  container.addEventListener('input', function(e){
    var t = e.target;
    if(t.dataset.searchCat){ applyRowFilter(t.dataset.searchCat); }
  });
}
function applyRowFilter(cat){
  var searchInput = document.querySelector('[data-search-cat="'+cat+'"]');
  var filterSelect = document.querySelector('[data-filter-cat="'+cat+'"]');
  var q = searchInput ? searchInput.value.trim().toLowerCase() : '';
  var src = filterSelect ? filterSelect.value : '';
  var rows = document.querySelectorAll('tr[data-row-cat="'+cat+'"]');
  rows.forEach(function(r){
    var matchesText = !q || (r.dataset.searchText||'').indexOf(q)!==-1;
    var matchesSrc = !src || r.dataset.sourceVal === src;
    r.style.display = (matchesText && matchesSrc) ? '' : 'none';
  });
}
